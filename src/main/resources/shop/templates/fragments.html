<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}">
    <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}">
    <title th:text="${title}">NEXORA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" rel="stylesheet">
    <link rel="stylesheet"
          th:href="${(#httpServletRequest != null and #httpServletRequest.requestURI != null and #httpServletRequest.requestURI.startsWith('/admin') ? '/admin/css/app.css' : '/shop/css/app.css') + '?v=20260516-4'}">
</head>
<body>
<th:block th:fragment="navbar">
    <div class="store-header">
        <div class="header-meta">
            <div class="container container-wide">
                <div class="header-meta-inner">
                    <a class="meta-link" href="tel:+79991112233">
                        <i class="bi bi-telephone-fill"></i>
                        <span>+7 (999) 111-22-33</span>
                    </a>
                    <span class="meta-item">
                        <i class="bi bi-geo-alt-fill"></i>
                        <span>г. Астрахань, ул. Савушкина, 12</span>
                    </span>
                    <span class="meta-item">
                        <i class="bi bi-clock-fill"></i>
                        <span>Ежедневно 10:00-21:00</span>
                    </span>
                </div>
            </div>
        </div>
    </div>
    <nav class="store-navbar navbar navbar-expand-lg bg-white navbar-shadow sticky-top">
        <div class="container container-wide py-3">
            <a class="navbar-brand brand-name" th:href="@{/}">NEXORA</a>
            <div class="mobile-header-quick-actions d-lg-none">
                <a class="icon-action" th:href="@{/wishlist}" title="Избранное">
                    <i class="bi bi-heart"></i>
                </a>
                <a class="icon-action cart-action position-relative" th:href="@{/cart}" title="Корзина">
                    <i class="bi bi-cart3"></i>
                    <span class="cart-badge"
                          th:classappend="${cartCount == 0} ? ' d-none'"
                          th:text="${cartCount}"></span>
                </a>
            </div>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav me-auto align-items-lg-center gap-lg-1">
                    <li class="nav-item dropdown nav-catalog d-none d-lg-block">
                        <div class="nav-catalog-trigger">
                            <a class="nav-link nav-catalog-link" th:href="@{/catalog}">Каталог</a>
                            <button class="btn nav-link dropdown-toggle nav-catalog-toggle"
                                    type="button"
                                    data-bs-toggle="dropdown"
                                    aria-expanded="false"
                                    aria-label="Показать категории">
                            </button>
                        </div>
                        <ul class="dropdown-menu catalog-level-1">
                            <li class="dropdown-submenu" th:each="category : ${topCategories}">
                                <a class="dropdown-item d-flex justify-content-between align-items-center"
                                   th:href="@{'/category/' + ${category.slug}}">
                                    <span th:text="${category.name}"></span>
                                    <i class="bi bi-chevron-right small"
                                       th:if="${subcategoriesByParentId[category.id] != null and !#lists.isEmpty(subcategoriesByParentId[category.id])}"></i>
                                </a>
                                <ul class="dropdown-menu catalog-level-2"
                                    th:if="${subcategoriesByParentId[category.id] != null and !#lists.isEmpty(subcategoriesByParentId[category.id])}">
                                    <li th:each="subcategory : ${subcategoriesByParentId[category.id]}">
                                        <a class="dropdown-item" th:href="@{'/category/' + ${subcategory.slug}}" th:text="${subcategory.name}"></a>
                                    </li>
                                </ul>
                            </li>
                        </ul>
                    </li>
                    <li class="nav-item d-lg-none nav-catalog-mobile">
                        <button class="nav-link nav-mobile-catalog-root-toggle"
                                type="button"
                                data-bs-toggle="collapse"
                                data-bs-target="#mobileCatalogRoot"
                                aria-expanded="false"
                                aria-controls="mobileCatalogRoot">
                            <span>Каталог</span>
                            <i class="bi bi-chevron-down"></i>
                        </button>
                        <div class="collapse mobile-catalog-root" id="mobileCatalogRoot">
                            <ul class="mobile-catalog-list">
                                <li class="mobile-catalog-item" th:each="category : ${topCategories}">
                                    <div class="mobile-catalog-row">
                                        <a class="mobile-catalog-link"
                                           th:href="@{'/category/' + ${category.slug}}"
                                           th:text="${category.name}"></a>
                                        <button class="mobile-catalog-sub-toggle"
                                                type="button"
                                                th:if="${subcategoriesByParentId[category.id] != null and !#lists.isEmpty(subcategoriesByParentId[category.id])}"
                                                data-bs-toggle="collapse"
                                                th:attr="data-bs-target=${'#mobile-sub-' + category.id},aria-controls=${'mobile-sub-' + category.id}"
                                                aria-expanded="false">
                                            <i class="bi bi-chevron-down"></i>
                                        </button>
                                    </div>
                                    <div class="collapse mobile-catalog-sub"
                                         th:id="${'mobile-sub-' + category.id}"
                                         th:if="${subcategoriesByParentId[category.id] != null and !#lists.isEmpty(subcategoriesByParentId[category.id])}">
                                        <a class="mobile-catalog-sub-link"
                                           th:each="subcategory : ${subcategoriesByParentId[category.id]}"
                                           th:href="@{'/category/' + ${subcategory.slug}}"
                                           th:text="${subcategory.name}"></a>
                                    </div>
                                </li>
                            </ul>
                        </div>
                    </li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/delivery}">Доставка и оплата</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/support}">Поддержка</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/contacts}">Контакты</a></li>
                </ul>
                <div class="header-actions">
                    <a class="icon-action d-none d-lg-inline-flex" th:href="@{/wishlist}" title="Избранное">
                        <i class="bi bi-heart"></i>
                    </a>
                    <a class="icon-action cart-action position-relative d-none d-lg-inline-flex" th:href="@{/cart}" title="Корзина">
                        <i class="bi bi-cart3"></i>
                        <span id="cart-count-badge"
                              class="cart-badge"
                              th:classappend="${cartCount == 0} ? ' d-none'"
                              th:text="${cartCount}"></span>
                    </a>
                    <a class="btn btn-auth btn-sm" th:if="${currentUser == null}" th:href="@{/login}">Войти</a>
                    <a class="btn btn-auth btn-sm"
                       th:if="${currentUser != null and !currentUser.isAdmin}"
                       th:href="@{/account}">Кабинет</a>
                    <a class="btn btn-auth btn-sm"
                       th:if="${currentUser != null and currentUser.isAdmin}"
                       th:href="@{/admin}">Админка</a>
                    <form th:if="${currentUser != null}" method="post" th:action="@{/logout}" class="m-0">
                        <button class="icon-action logout-action" type="submit" title="Выйти">
                            <i class="bi bi-box-arrow-right"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </nav>
</th:block>

<nav class="navbar navbar-expand-lg bg-white navbar-shadow sticky-top" th:fragment="adminNavbar">
    <div class="container container-wide py-1">
        <a class="navbar-brand fw-semibold" th:href="@{/admin}">Админка NEXORA</a>
        <div class="d-flex align-items-center justify-content-between flex-grow-1">
            <div class="navbar-nav">
                <a class="nav-link" th:href="@{/admin/products}">Товары</a>
                <a class="nav-link" th:href="@{/admin/categories}">Категории</a>
                <a class="nav-link" th:href="@{/admin/filters}">Фильтры</a>
                <a class="nav-link" th:href="@{/admin/files}">Файлы</a>
                <a class="nav-link" th:href="@{/admin/orders}">Заказы</a>
                <a class="nav-link" th:href="@{/admin/users}">Пользователи</a>
                <a class="nav-link" th:href="@{/admin/reviews}">Отзывы</a>
                <a class="nav-link" th:href="@{/admin/support}">Заявки</a>
                    <a class="nav-link" th:href="@{/}">На сайт</a>
            </div>
            <div class="d-flex align-items-center gap-2 ms-3">
                <form method="post" th:action="@{/logout}" class="m-0">
                    <button class="btn btn-outline-danger btn-sm" type="submit">
                        <i class="bi bi-box-arrow-right"></i>
                        Выйти
                    </button>
                </form>
            </div>
        </div>
    </div>
</nav>

<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script th:src="${(#httpServletRequest != null and #httpServletRequest.requestURI != null and #httpServletRequest.requestURI.startsWith('/admin') ? '/admin/js/store.js' : '/shop/js/store.js') + '?v=20260516-5'}"></script>
</div>
</body>
</html>
