<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Вход')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<main class="container py-5" style="max-width:560px;">
    <div class="glass-card p-4">
        <h1 class="h4 mb-3">Вход</h1>
        <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
        <div class="alert alert-success" th:if="${param.credentialsUpdated}">Учётные данные обновлены, выполните вход снова.</div>
        <div class="alert alert-success" th:if="${param.accountDeleted}">Аккаунт удалён.</div>
        <div class="alert alert-success" th:if="${param.logout}">Вы вышли из системы.</div>
        <div class="alert alert-danger" th:if="${param.error}">Неверный логин или пароль.</div>
        <form th:action="@{/login}" method="post" class="row g-3">
            <div class="col-12">
                <label class="form-label">Логин</label>
                <input class="form-control" type="text" name="username">
            </div>
            <div class="col-12">
                <label class="form-label">Пароль</label>
                <input class="form-control" type="password" name="password">
            </div>
            <div class="col-12 d-flex gap-2">
                <button class="btn btn-primary" type="submit">Войти</button>
                <a class="btn btn-outline-secondary" th:href="@{/register}">Регистрация</a>
            </div>
        </form>
        <p class="small text-muted mt-3 mb-0">Демо-админ: admin / admin</p>
    </div>
</main>
<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
