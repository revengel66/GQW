<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Контакты')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<main class="container container-wide py-4 pb-5">
    <section class="glass-card p-4 p-lg-5">
        <h1 class="h3 mb-4">Контакты NEXORA</h1>
        <div class="row g-4">
            <div class="col-md-4">
                <div class="p-1 h-100">
                    <h2 class="h6 mb-2"><i class="bi bi-telephone-fill me-2"></i>Телефон</h2>
                    <a class="text-decoration-none" href="tel:+79991112233">+7 (999) 111-22-33</a>
                </div>
            </div>
            <div class="col-md-4">
                <div class="p-1 h-100">
                    <h2 class="h6 mb-2"><i class="bi bi-geo-alt-fill me-2"></i>Адрес</h2>
                    <p class="mb-0 text-muted">г. Астрахань, ул. Савушкина, 12</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="p-1 h-100">
                    <h2 class="h6 mb-2"><i class="bi bi-clock-fill me-2"></i>График</h2>
                    <p class="mb-0 text-muted">Ежедневно 10:00-21:00</p>
                </div>
            </div>
        </div>
    </section>

    <section class="section-gap-sm glass-card p-4 p-lg-5">
        <h2 class="h5 mb-3">Связь с поддержкой</h2>
        <p class="text-muted mb-3">Для обращений используйте отдельную страницу поддержки с формой заявки.</p>
        <a class="btn btn-brand" th:href="@{/support}">Перейти в поддержку</a>
    </section>
</main>
<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
