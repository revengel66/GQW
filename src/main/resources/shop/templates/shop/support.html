<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Поддержка')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<main class="container container-wide py-4 pb-5">
    <div class="alert alert-success" th:if="${supportSuccess}" th:text="${supportSuccess}"></div>
    <div class="alert alert-danger" th:if="${supportError}" th:text="${supportError}"></div>

    <section class="glass-card p-4 p-lg-5">
        <h1 class="h3 mb-3">Связь с поддержкой</h1>
        <p class="text-muted mb-4">Оставьте заявку, и менеджер свяжется с вами по телефону или email.</p>
        <form class="row g-3" th:action="@{/support/request}" th:object="${supportForm}" method="post">
            <div class="col-md-4">
                <input class="form-control" th:field="*{name}" placeholder="Ваше имя">
            </div>
            <div class="col-md-4">
                <input class="form-control" th:field="*{email}" placeholder="Email">
            </div>
            <div class="col-md-4">
                <input class="form-control" th:field="*{phone}" placeholder="Телефон">
            </div>
            <div class="col-12">
                <textarea class="form-control" th:field="*{message}" rows="5" placeholder="Опишите ваш вопрос"></textarea>
            </div>
            <div class="col-12">
                <button class="btn btn-brand" type="submit">Отправить заявку</button>
            </div>
        </form>
    </section>
</main>
<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
