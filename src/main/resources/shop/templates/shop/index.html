<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('NEXORA Tech - Главная')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<main class="container container-wide py-4 pb-5">
    <section class="hero-banner">
        <div class="hero-overlay">
            <div class="hero-content">
                <p class="hero-kicker">Интернет-магазин техники</p>
                <h1 class="display-5 fw-bold mb-3">NEXORA</h1>
                <p class="mb-4 text-white-50 hero-subtitle">
                    Ноутбуки, смартфоны и аксессуары. Минималистичный UX, быстрый заказ и удобная админ-панель.
                </p>
                <div class="d-flex flex-wrap gap-3">
                    <a class="btn hero-cta btn-lg" th:href="@{/catalog}">Перейти в каталог</a>
                </div>
            </div>
        </div>
    </section>

    <section class="section-gap">
        <div class="products-slider-wrap categories-slider-wrap">
            <div class="d-flex justify-content-between align-items-center section-head section-head-slider">
                <h2 class="section-title mb-0">Каталог</h2>
                <div class="products-slider-controls products-slider-controls-inline">
                    <button class="slider-nav slider-prev" type="button" aria-label="Предыдущие категории">
                        <i class="bi bi-chevron-left"></i>
                    </button>
                    <button class="slider-nav slider-next" type="button" aria-label="Следующие категории">
                        <i class="bi bi-chevron-right"></i>
                    </button>
                </div>
            </div>
            <div class="swiper js-categories-slider">
                <div class="swiper-wrapper">
                    <div class="swiper-slide" th:each="c : ${topCategories}">
                        <article class="catalog-category-card h-100"
                                 th:with="children=${subcategoriesByParentId != null ? subcategoriesByParentId[c.id] : null}">
                            <div class="catalog-category-media-wrap">
                                <img class="catalog-category-media"
                                     th:src="${c.imageUrl != null ? c.imageUrl : '/img/products/placeholder.webp'}"
                                     alt="">
                            </div>
                            <div class="catalog-category-body">
                                <div class="catalog-category-title mb-0" th:text="${c.name}"></div>
                            </div>
                            <div class="catalog-category-hover">
                                <a class="catalog-category-hover-main"
                                   th:href="@{'/category/' + ${c.slug}}"
                                   th:text="${c.name}"></a>
                                <div class="catalog-category-hover-links"
                                     th:if="${children != null and !#lists.isEmpty(children)}">
                                    <a class="catalog-category-hover-link"
                                       th:each="sub,iter : ${children}"
                                       th:if="${iter.index < 4}"
                                       th:href="@{'/category/' + ${sub.slug}}"
                                       th:text="${sub.name}"></a>
                                    <a class="catalog-category-hover-more"
                                       th:if="${#lists.size(children) > 4}"
                                       th:href="@{'/category/' + ${c.slug}}">
                                        Смотреть все
                                        <i class="bi bi-arrow-right"></i>
                                    </a>
                                </div>
                            </div>
                        </article>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section class="section-gap" id="new-products">
        <div class="products-slider-wrap">
            <div class="d-flex justify-content-between align-items-center section-head section-head-slider">
                <h2 class="section-title mb-0">Новые товары</h2>
                <div class="products-slider-controls products-slider-controls-inline">
                    <button class="slider-nav slider-prev" type="button" aria-label="Предыдущие товары">
                        <i class="bi bi-chevron-left"></i>
                    </button>
                    <button class="slider-nav slider-next" type="button" aria-label="Следующие товары">
                        <i class="bi bi-chevron-right"></i>
                    </button>
                </div>
            </div>
            <div class="swiper js-products-slider">
                <div class="swiper-wrapper">
                    <div class="swiper-slide" th:each="p : ${products}">
                        <article class="product-card h-100 js-product-card-link"
                                 th:with="features=${productCardFeatures[p.id]}, inCartQty=${cartItemQuantities[p.id] != null ? cartItemQuantities[p.id] : 0}"
                                 th:attr="data-product-url=@{'/product/' + ${p.slug}}">
                            <div class="product-card-media-wrap">
                                <img class="product-card-media"
                                     th:src="${p.primaryImageUrl != null ? p.primaryImageUrl : '/img/products/placeholder.webp'}"
                                     alt="">
                                <div class="product-card-badges">
                                    <span class="product-badge badge-hit" th:if="${p.isHit}">Хит</span>
                                    <span class="product-badge badge-new" th:if="${p.isNew}">Новинка</span>
                                    <span class="product-badge badge-discount"
                                          th:if="${p.discountPercent != null}"
                                          th:text="${'-' + p.discountPercent + '%'}"></span>
                                </div>
                            </div>
                            <div class="product-card-body">
                                <div class="product-title">
                                    <a th:href="@{'/product/' + ${p.slug}}" th:text="${p.name}"></a>
                                </div>
                                <div class="small text-danger mb-1" th:if="${!p.inStock}">Нет в наличии</div>
                                <ul class="product-features" th:if="${features != null and !#lists.isEmpty(features)}">
                                    <li th:each="ch : ${features}" th:text="${ch.name + ': ' + ch.value}"></li>
                                </ul>
                                <div class="product-price-row">
                                <div class="product-price-box">
                                        <div class="product-price-old"
                                             th:if="${p.oldPrice != null}"
                                             th:text="${#numbers.formatDecimal(p.oldPrice, 1, 'COMMA', 0, 'POINT')} + ' ₽'"></div>
                                        <div class="product-price-current"
                                             th:text="${#numbers.formatDecimal(p.price, 1, 'COMMA', 0, 'POINT')} + ' ₽'"></div>
                                </div>
                                    <div class="product-icon-actions">
                                        <form class="m-0 js-wishlist-toggle-form"
                                              th:action="@{/api/wishlist/toggle}"
                                              method="post"
                                              th:attr="data-product-id=${p.id}">
                                            <input type="hidden" name="productId" th:value="${p.id}">
                                            <button class="wishlist-icon-btn js-wishlist-btn"
                                                    th:classappend="${wishlistProductIds != null and wishlistProductIds.contains(p.id)} ? ' is-active'"
                                                    type="submit"
                                                    title="В избранное">
                                                <i th:class="${wishlistProductIds != null and wishlistProductIds.contains(p.id)} ? 'bi bi-heart-fill' : 'bi bi-heart'"></i>
                                            </button>
                                        </form>
                                        <form class="m-0 js-cart-toggle-form"
                                              th:action="@{/api/cart/toggle-one}"
                                              method="post"
                                              th:attr="data-product-id=${p.id}">
                                            <input type="hidden" name="productId" th:value="${p.id}">
                                            <button class="cart-icon-btn" type="submit" title="В корзину" th:disabled="${!p.inStock}">
                                                <i class="bi bi-cart3"></i>
                                                <span class="product-cart-qty js-product-cart-qty"
                                                      th:classappend="${inCartQty == 0} ? ' d-none'"
                                                      th:text="${inCartQty}"></span>
                                            </button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </article>
                    </div>
                </div>
            </div>
        </div>
    </section>

</main>

<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
