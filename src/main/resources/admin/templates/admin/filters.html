<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Админка - Фильтры')}"></head>
<body>
<nav th:replace="~{fragments :: adminNavbar}"></nav>
<main class="container container-wide py-4">
    <nav class="admin-breadcrumb mb-3" aria-label="breadcrumb">
        <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a th:href="@{/admin}">Админка</a></li>
            <li class="breadcrumb-item active" aria-current="page">Фильтры</li>
        </ol>
    </nav>

    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <h1 class="h4 mb-0">Фильтры и опции</h1>
        <a class="btn btn-primary btn-sm" th:href="@{/admin/filters/new}">
            <i class="bi bi-plus-lg me-1"></i>
            Добавить фильтр
        </a>
    </div>

    <div class="alert alert-success" th:if="${filterSuccess}" th:text="${filterSuccess}"></div>
    <div class="alert alert-danger" th:if="${filterError}" th:text="${filterError}"></div>

    <div class="glass-card p-4" th:if="${#lists.isEmpty(filters)}">
        <div class="text-muted">Фильтры пока не созданы.</div>
    </div>

    <div class="glass-card p-3 p-md-4 table-responsive" th:if="${!#lists.isEmpty(filters)}">
        <table class="table align-middle mb-0">
            <thead>
            <tr>
                <th>ID</th>
                <th>Название</th>
                <th>Тип значения</th>
                <th>Вид вывода</th>
                <th>Режим</th>
                <th>Статус</th>
                <th class="text-end">Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="f : ${filters}">
                <td th:text="${f.id}">0</td>
                <td class="fw-semibold" th:text="${f.name}">Фильтр</td>
                <td>
                    <span th:switch="${f.valueType}">
                        <span th:case="'LIST'">Список</span>
                        <span th:case="'NUMBER'">Число</span>
                        <span th:case="'TEXT'">Текст</span>
                        <span th:case="*">Список</span>
                    </span>
                </td>
                <td>
                    <span th:switch="${f.viewType}">
                        <span th:case="'CHECKBOX'">Чекбоксы</span>
                        <span th:case="'RADIO'">Радиокнопки</span>
                        <span th:case="'SLIDER'">Слайдер</span>
                        <span th:case="*">Чекбоксы</span>
                    </span>
                </td>
                <td>
                    <span th:if="${T(java.lang.Boolean).TRUE.equals(f.multiValue)}">Множественный</span>
                    <span th:if="${!T(java.lang.Boolean).TRUE.equals(f.multiValue)}">Одиночный</span>
                </td>
                <td>
                    <span class="badge text-bg-success" th:if="${T(java.lang.Boolean).TRUE.equals(f.isEnabled)}">Включён</span>
                    <span class="badge text-bg-secondary" th:if="${!T(java.lang.Boolean).TRUE.equals(f.isEnabled)}">Отключён</span>
                </td>
                <td class="text-end">
                    <div class="d-inline-flex align-items-center gap-2">
                        <a class="btn btn-outline-primary btn-sm"
                           th:href="@{'/admin/filters/' + ${f.id} + '/edit'}"
                           title="Редактировать фильтр">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <form method="post" class="m-0" th:action="@{'/admin/filters/' + ${f.id} + '/delete'}">
                            <button class="btn btn-outline-danger btn-sm" type="submit" title="Удалить фильтр">
                                <i class="bi bi-trash3"></i>
                            </button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
