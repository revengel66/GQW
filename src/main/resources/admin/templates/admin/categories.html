<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Админка - Категории')}"></head>
<body>
<nav th:replace="~{fragments :: adminNavbar}"></nav>
<main class="container container-wide py-4">
    <nav class="admin-breadcrumb mb-3" aria-label="breadcrumb">
        <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a th:href="@{/admin}">Админка</a></li>
            <li class="breadcrumb-item active" aria-current="page">Категории</li>
        </ol>
    </nav>

    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <div class="h4 mb-0">Категории</div>
        <div class="d-flex align-items-center gap-2 flex-wrap">
            <form method="get" th:action="@{/admin/categories}" class="d-flex align-items-center gap-2">
                <label class="small text-muted mb-0" for="category-sort-select">Сортировка</label>
                <select class="form-select form-select-sm" id="category-sort-select" name="sort" onchange="this.form.submit()">
                    <option value="date_desc" th:selected="${categorySort == 'date_desc'}">По дате добавления: новые</option>
                    <option value="date_asc" th:selected="${categorySort == 'date_asc'}">По дате добавления: старые</option>
                    <option value="name_asc" th:selected="${categorySort == 'name_asc'}">По алфавиту: А-Я</option>
                    <option value="name_desc" th:selected="${categorySort == 'name_desc'}">По алфавиту: Я-А</option>
                </select>
            </form>
            <a class="btn btn-primary btn-sm px-3" th:href="@{/admin/categories/new}">
                <i class="bi bi-plus-lg"></i>
                Добавить категорию
            </a>
        </div>
    </div>
    <div class="alert alert-success" th:if="${categorySuccess}" th:text="${categorySuccess}"></div>
    <div class="alert alert-danger" th:if="${categoryError}" th:text="${categoryError}"></div>

    <div class="glass-card p-4">
        <div class="text-muted" th:if="${#lists.isEmpty(categoryRows)}">Категорий пока нет.</div>
        <table class="table align-middle admin-category-table" th:if="${!#lists.isEmpty(categoryRows)}">
            <thead>
            <tr>
                <th style="width: 70px;">ID</th>
                <th>Категория</th>
                <th>Slug</th>
                <th style="width: 88px;">Фото</th>
                <th class="text-end">Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="row : ${categoryRows}"
                class="admin-category-row"
                th:classappend="${row.depth > 0} ? ' admin-category-child'"
                th:style="'--cat-depth:' + ${row.depth}"
                th:attr="data-id=${row.category.id},data-parent=${row.parentId != null ? row.parentId : ''}">
                <td class="text-muted" th:text="${row.category.id}"></td>
                <td class="admin-category-col">
                    <div class="d-flex align-items-center gap-2 admin-category-cell">
                        <button class="admin-category-toggle"
                                th:if="${!row.leaf}"
                                type="button"
                                th:attr="data-category-toggle=${row.category.id},aria-expanded=true"
                                title="Свернуть/развернуть подкатегории">
                            <i class="bi bi-chevron-down"></i>
                        </button>
                        <span class="admin-category-toggle-placeholder" th:if="${row.leaf}"></span>
                        <strong th:text="${row.category.name}"></strong>
                    </div>
                </td>
                <td th:text="${row.category.slug}"></td>
                <td>
                    <img class="cart-item-thumb"
                         th:if="${row.category.imageUrl != null and !#strings.isEmpty(row.category.imageUrl)}"
                         th:src="${row.category.imageUrl}"
                         alt="">
                    <div class="cart-item-thumb d-inline-flex align-items-center justify-content-center border bg-light"
                         th:if="${row.category.imageUrl == null or #strings.isEmpty(row.category.imageUrl)}">
                        <i class="bi bi-camera"></i>
                    </div>
                </td>
                <td class="text-end">
                    <div class="d-inline-flex align-items-center gap-2 admin-category-actions">
                        <a class="btn btn-outline-secondary btn-sm admin-category-action-btn"
                           th:href="@{/admin/products/new(categoryId=${row.category.id})}"
                           title="Добавить товар в категорию">
                            <i class="bi bi-box-seam"></i>
                            <span>Добавить товар</span>
                        </a>
                        <a class="btn btn-outline-primary btn-sm admin-category-action-btn"
                           th:href="@{'/admin/categories/' + ${row.category.id} + '/edit'}"
                           title="Редактировать категорию">
                            <i class="bi bi-pencil"></i>
                            <span>Редактировать</span>
                        </a>
                        <button class="btn btn-outline-danger btn-sm"
                                type="button"
                                data-bs-toggle="modal"
                                th:attr="data-bs-target=${'#deleteCategoryModal-' + row.category.id}"
                                title="Удалить категорию">
                            <i class="bi bi-trash3"></i>
                        </button>
                    </div>

                    <div class="modal fade"
                         th:attr="id=${'deleteCategoryModal-' + row.category.id}"
                         tabindex="-1"
                         aria-hidden="true">
                        <div class="modal-dialog modal-dialog-centered">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <div class="h6 mb-0">Удаление категории</div>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                </div>
                                <div class="modal-body text-start">
                                    <p class="mb-2">
                                        Удалить категорию <strong th:text="${row.category.name}"></strong>?
                                    </p>
                                    <p class="small text-muted mb-0">
                                        Товары, привязанные только к этой категории, будут удалены.
                                        Если товар привязан к другим категориям, он сохранится.
                                    </p>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Отмена</button>
                                    <form th:action="@{'/admin/categories/' + ${row.category.id} + '/delete'}" method="post" class="m-0">
                                        <button class="btn btn-danger btn-sm" type="submit">Удалить</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<div th:replace="~{fragments :: scripts}"></div>
<script>
    (function () {
        const rows = Array.from(document.querySelectorAll(".admin-category-row"));
        if (!rows.length) {
            return;
        }

        const rowById = new Map();
        rows.forEach((row) => {
            const id = row.getAttribute("data-id");
            if (id) {
                rowById.set(id, row);
            }
        });

        const collapsedIds = new Set();

        function hasCollapsedAncestor(row) {
            let parentId = row.getAttribute("data-parent");
            while (parentId) {
                if (collapsedIds.has(parentId)) {
                    return true;
                }
                const parentRow = rowById.get(parentId);
                if (!parentRow) {
                    break;
                }
                parentId = parentRow.getAttribute("data-parent");
            }
            return false;
        }

        function syncAccordionState() {
            rows.forEach((row) => {
                row.classList.toggle("d-none", hasCollapsedAncestor(row));
            });
            document.querySelectorAll("[data-category-toggle]").forEach((btn) => {
                const id = btn.getAttribute("data-category-toggle");
                const collapsed = id != null && collapsedIds.has(id);
                btn.classList.toggle("is-collapsed", collapsed);
                btn.setAttribute("aria-expanded", String(!collapsed));
            });
        }

        document.querySelectorAll("[data-category-toggle]").forEach((btn) => {
            btn.addEventListener("click", () => {
                const id = btn.getAttribute("data-category-toggle");
                if (!id) {
                    return;
                }
                if (collapsedIds.has(id)) {
                    collapsedIds.delete(id);
                } else {
                    collapsedIds.add(id);
                }
                syncAccordionState();
            });
        });

        syncAccordionState();
    })();
</script>
</body>
</html>
