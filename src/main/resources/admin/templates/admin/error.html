<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Ошибка админ-панели')}"></head>
<body>
<nav th:replace="~{fragments :: adminNavbar}"></nav>
<main class="container py-4">
    <div class="glass-card p-4">
        <div class="small text-muted mb-2">Код ошибки</div>
        <div class="display-6 fw-bold mb-2" th:text="${errorStatus}">500</div>
        <h1 class="h4 mb-3" th:text="${errorTitle}">Произошла ошибка</h1>
        <p class="mb-3" th:text="${errorMessage}">
            Произошла ошибка при выполнении запроса.
        </p>
        <div class="small text-muted mb-3" th:if="${errorPath != null and !#strings.isEmpty(errorPath)}">
            Путь: <span th:text="${errorPath}">/admin</span>
        </div>
        <div class="d-flex gap-2 flex-wrap">
            <a class="btn btn-primary btn-sm" th:href="@{/admin}">В админку</a>
            <a class="btn btn-outline-secondary btn-sm" href="javascript:history.back()">Назад</a>
        </div>
    </div>
</main>
<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
