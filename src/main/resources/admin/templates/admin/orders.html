<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Админка - Заказы')}"></head>
<body>
<nav th:replace="~{fragments :: adminNavbar}"></nav>
<main class="container container-wide py-4">
    <nav class="admin-breadcrumb mb-3" aria-label="breadcrumb">
        <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a th:href="@{/admin}">Админка</a></li>
            <li class="breadcrumb-item active" aria-current="page">Заказы</li>
        </ol>
    </nav>

    <div class="d-flex justify-content-between align-items-center gap-2 flex-wrap mb-3">
        <h1 class="h4 mb-0">Заказы</h1>
        <div class="small text-muted">
            Найдено: <span th:text="${#lists.size(orders)}">0</span>
        </div>
    </div>

    <div class="alert alert-success" th:if="${orderSuccess}" th:text="${orderSuccess}"></div>
    <div class="alert alert-danger" th:if="${orderError}" th:text="${orderError}"></div>

    <section class="glass-card p-3 mb-3">
        <form method="get" class="row g-2 align-items-end">
            <div class="col-md-3">
                <label class="form-label mb-1">Поиск</label>
                <input class="form-control" name="q" placeholder="ID, покупатель, email, телефон" th:value="${orderQuery}">
            </div>
            <div class="col-md-2 col-sm-6">
                <label class="form-label mb-1">Статус</label>
                <select class="form-select" name="status">
                    <option value="ALL" th:selected="${orderStatusFilter == 'ALL'}">Все статусы</option>
                    <option th:each="s : ${statuses}"
                            th:value="${s.name()}"
                            th:selected="${orderStatusFilter == s.name()}"
                            th:text="${orderStatusRuMap[s.name()] != null ? orderStatusRuMap[s.name()] : s.name()}"></option>
                </select>
            </div>
            <div class="col-md-2 col-sm-6">
                <label class="form-label mb-1">Получение</label>
                <select class="form-select" name="type">
                    <option value="ALL" th:selected="${orderTypeFilter == 'ALL'}">Все</option>
                    <option value="DELIVERY" th:selected="${orderTypeFilter == 'DELIVERY'}">Доставка</option>
                    <option value="PICKUP" th:selected="${orderTypeFilter == 'PICKUP'}">Самовывоз</option>
                </select>
            </div>
            <div class="col-md-2 col-sm-6">
                <label class="form-label mb-1">Дата с</label>
                <input class="form-control" type="date" name="dateFrom" th:value="${orderDateFrom}">
            </div>
            <div class="col-md-2 col-sm-6">
                <label class="form-label mb-1">Дата по</label>
                <input class="form-control" type="date" name="dateTo" th:value="${orderDateTo}">
            </div>
            <div class="col-md-1 col-sm-6">
                <label class="form-label mb-1">Сорт.</label>
                <select class="form-select" name="sort">
                    <option value="CREATED_DESC" th:selected="${orderSort == 'CREATED_DESC'}">Новые</option>
                    <option value="CREATED_ASC" th:selected="${orderSort == 'CREATED_ASC'}">Старые</option>
                    <option value="UPDATED_DESC" th:selected="${orderSort == 'UPDATED_DESC'}">Статус: новые</option>
                    <option value="UPDATED_ASC" th:selected="${orderSort == 'UPDATED_ASC'}">Статус: старые</option>
                    <option value="AMOUNT_DESC" th:selected="${orderSort == 'AMOUNT_DESC'}">Сумма ↓</option>
                    <option value="AMOUNT_ASC" th:selected="${orderSort == 'AMOUNT_ASC'}">Сумма ↑</option>
                    <option value="STATUS_ASC" th:selected="${orderSort == 'STATUS_ASC'}">Статус А-Я</option>
                    <option value="STATUS_DESC" th:selected="${orderSort == 'STATUS_DESC'}">Статус Я-А</option>
                </select>
            </div>
            <div class="col-12 d-flex align-items-center justify-content-end gap-2">
                <a class="btn btn-outline-secondary btn-sm admin-products-reset-btn" th:href="@{/admin/orders}" title="Сбросить">
                    <i class="bi bi-x-lg"></i>
                </a>
                <button class="btn btn-dark admin-products-apply-btn" type="submit" title="Применить">
                    <i class="bi bi-check-lg"></i>
                </button>
            </div>
        </form>
    </section>

    <section class="glass-card p-4" th:if="${#lists.isEmpty(orders)}">
        <div class="text-muted">Заказы по выбранным фильтрам не найдены.</div>
    </section>

    <section class="glass-card p-3 p-md-4 table-responsive" th:if="${!#lists.isEmpty(orders)}">
        <table class="table align-middle mb-0">
            <thead>
            <tr>
                <th>ID</th>
                <th>Создан</th>
                <th>Изменение статуса</th>
                <th>Покупатель</th>
                <th>Получение</th>
                <th>Сумма</th>
                <th>Статус</th>
                <th>Товаров</th>
                <th class="text-end">Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="o : ${orders}">
                <td class="text-muted" th:text="${o.id}"></td>
                <td th:text="${o.createdAt != null ? #temporals.format(o.createdAt, 'dd.MM.yyyy HH:mm') : '—'}"></td>
                <td th:text="${orderLastStatusChangedById[o.id] != null ? #temporals.format(orderLastStatusChangedById[o.id], 'dd.MM.yyyy HH:mm') : '—'}"></td>
                <td>
                    <div class="fw-semibold" th:text="${o.customerName}"></div>
                    <div class="small">
                        <a th:href="${'mailto:' + o.customerEmail}" th:text="${o.customerEmail}"></a>
                    </div>
                    <div class="small text-muted" th:if="${o.customerPhone != null and !#strings.isEmpty(o.customerPhone)}" th:text="${o.customerPhone}"></div>
                    <div class="small mt-1" th:if="${o.user != null}">
                        <a th:href="@{'/admin/users/' + ${o.user.id}}">Пользователь #<span th:text="${o.user.id}"></span></a>
                    </div>
                </td>
                <td th:text="${o.deliveryType == 'DELIVERY' ? 'Доставка' : 'Самовывоз'}"></td>
                <td th:text="${#numbers.formatDecimal(o.totalAmount,1,'COMMA',2,'POINT')} + ' ₽'"></td>
                <td>
                    <div th:class="'badge ' + ${orderStatusClassMap[o.status.name()] != null ? orderStatusClassMap[o.status.name()] : 'text-bg-secondary'}"
                         th:text="${orderStatusRuMap[o.status.name()] != null ? orderStatusRuMap[o.status.name()] : o.status}">
                    </div>
                    <form class="mt-2"
                          th:action="@{'/admin/orders/' + ${o.id} + '/status'}"
                          method="post">
                        <input type="hidden" name="returnTo" value="orders">
                        <input type="hidden" name="orderStatus" th:value="${orderStatusFilter}">
                        <input type="hidden" name="orderType" th:value="${orderTypeFilter}">
                        <input type="hidden" name="orderSort" th:value="${orderSort}">
                        <input type="hidden" name="orderQuery" th:value="${orderQuery}">
                        <input type="hidden" name="orderDateFrom" th:value="${orderDateFrom}">
                        <input type="hidden" name="orderDateTo" th:value="${orderDateTo}">
                        <select class="form-select form-select-sm"
                                name="status"
                                onchange="if(this.form.requestSubmit){this.form.requestSubmit();}else{this.form.submit();}">
                            <option th:each="s : ${statuses}"
                                    th:value="${s.name()}"
                                    th:selected="${s == o.status}"
                                    th:text="${orderStatusRuMap[s.name()] != null ? orderStatusRuMap[s.name()] : s.name()}"></option>
                        </select>
                    </form>
                </td>
                <td th:text="${orderItemCountById[o.id] != null ? orderItemCountById[o.id] : 0}"></td>
                <td class="text-end">
                    <div class="d-inline-flex align-items-center gap-2">
                        <a class="btn btn-outline-primary btn-sm admin-mini-icon-btn"
                           th:href="@{/admin/orders/{id}(id=${o.id},status=${orderStatusFilter},type=${orderTypeFilter},sort=${orderSort},q=${orderQuery},dateFrom=${orderDateFrom},dateTo=${orderDateTo})}"
                           title="Подробнее / редактировать">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <button class="btn btn-outline-danger btn-sm admin-mini-icon-btn"
                                type="button"
                                data-bs-toggle="modal"
                                th:attr="data-bs-target=${'#deleteOrderModal-' + o.id}"
                                title="Удалить заказ">
                            <i class="bi bi-trash3"></i>
                        </button>
                    </div>

                    <div class="modal fade"
                         th:attr="id=${'deleteOrderModal-' + o.id}"
                         tabindex="-1"
                         aria-hidden="true">
                        <div class="modal-dialog modal-dialog-centered">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <div class="h6 mb-0">Удаление заказа</div>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                </div>
                                <div class="modal-body text-start">
                                    Удалить заказ <strong th:text="${'#' + o.id}">#0</strong>?
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Отмена</button>
                                    <form th:action="@{'/admin/orders/' + ${o.id} + '/delete'}" method="post" class="m-0">
                                        <input type="hidden" name="status" th:value="${orderStatusFilter}">
                                        <input type="hidden" name="type" th:value="${orderTypeFilter}">
                                        <input type="hidden" name="sort" th:value="${orderSort}">
                                        <input type="hidden" name="q" th:value="${orderQuery}">
                                        <input type="hidden" name="dateFrom" th:value="${orderDateFrom}">
                                        <input type="hidden" name="dateTo" th:value="${orderDateTo}">
                                        <button class="btn btn-danger btn-sm" type="submit">Удалить</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
