<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Админка - Отзывы')}"></head>
<body>
<nav th:replace="~{fragments :: adminNavbar}"></nav>
<main class="container container-wide py-4">
    <nav class="admin-breadcrumb mb-3" aria-label="breadcrumb">
        <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a th:href="@{/admin}">Админка</a></li>
            <li class="breadcrumb-item active" aria-current="page">Отзывы</li>
        </ol>
    </nav>

    <h1 class="h4 mb-3">Отзывы</h1>
    <div class="alert alert-success" th:if="${reviewSuccess}" th:text="${reviewSuccess}"></div>
    <div class="alert alert-danger" th:if="${reviewError}" th:text="${reviewError}"></div>

    <div class="glass-card p-3 mb-4">
        <form method="get" class="row g-2 align-items-end">
            <div class="col-md-3">
                <label class="form-label mb-1">Статус</label>
                <select class="form-select" name="status">
                    <option value="PENDING" th:selected="${status == 'PENDING'}">На модерации</option>
                    <option value="APPROVED" th:selected="${status == 'APPROVED'}">Опубликованные</option>
                    <option value="REJECTED" th:selected="${status == 'REJECTED'}">Отклонённые</option>
                    <option value="ALL" th:selected="${status == 'ALL'}">Все</option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label mb-1">Оценка</label>
                <select class="form-select" name="rating">
                    <option value="">Любая</option>
                    <option th:each="r : ${#numbers.sequence(1,5)}" th:value="${r}" th:selected="${rating != null and rating == r}" th:text="${r}"></option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label mb-1">Дата с</label>
                <input class="form-control" type="date" name="dateFrom" th:value="${dateFrom}">
            </div>
            <div class="col-md-2">
                <label class="form-label mb-1">Дата по</label>
                <input class="form-control" type="date" name="dateTo" th:value="${dateTo}">
            </div>
            <input type="hidden" name="limit" value="30">
            <div class="col-md-3 d-flex align-items-end gap-2">
                <button class="btn btn-primary flex-grow-1" type="submit">Применить</button>
                <a class="btn btn-outline-secondary btn-sm" th:href="@{/admin/reviews(status=${status})}" title="Сбросить">
                    <i class="bi bi-x-lg"></i>
                </a>
            </div>
        </form>
        <div class="small text-muted mt-2">
            Показано <span th:text="${reviewsShown}">0</span> из <span th:text="${reviewsTotal}">0</span>
        </div>
    </div>

    <div class="glass-card p-4" th:if="${#lists.isEmpty(reviews)}">
        <div class="text-muted">Отзывы не найдены.</div>
    </div>

    <div class="glass-card p-3 p-md-4 table-responsive" th:if="${!#lists.isEmpty(reviews)}">
        <table class="table align-middle mb-0">
            <thead>
            <tr>
                <th>ID</th>
                <th>Товар</th>
                <th>Автор</th>
                <th>Оценка</th>
                <th style="max-width: 360px;">Текст</th>
                <th>Статус</th>
                <th>Дата</th>
                <th class="text-end">Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${reviews}">
                <td th:text="${r.id}"></td>
                <td>
                    <a th:if="${r.product != null}"
                       th:href="@{'/admin/products/' + ${r.product.id} + '/edit'}"
                       th:text="${r.product.name}"></a>
                    <span th:if="${r.product == null}">—</span>
                </td>
                <td>
                    <a th:if="${r.user != null}"
                       th:href="@{'/admin/users/' + ${r.user.id}}"
                       th:text="${r.user.username}"></a>
                    <span th:if="${r.user == null}" th:text="${r.guestName != null ? r.guestName : 'Гость'}"></span>
                </td>
                <td th:text="${r.rating != null ? r.rating : '-'}"></td>
                <td style="max-width: 360px;">
                    <div class="small text-muted"
                         th:text="${r.text != null and #strings.length(r.text) > 180 ? #strings.substring(r.text, 0, 180) + '…' : r.text}"></div>
                </td>
                <td>
                    <span class="badge text-bg-warning" th:if="${!r.moderated}">На модерации</span>
                    <span class="badge text-bg-success" th:if="${r.moderated and r.approved}">Опубликован</span>
                    <span class="badge text-bg-secondary" th:if="${r.moderated and !r.approved}">Отклонён</span>
                </td>
                <td th:text="${#temporals.format(r.createdAt, 'dd.MM.yyyy HH:mm')}"></td>
                <td class="text-end">
                    <div class="d-inline-flex align-items-center gap-2">
                        <button class="btn btn-outline-dark btn-sm admin-mini-icon-btn"
                                type="button"
                                data-bs-toggle="modal"
                                th:attr="data-bs-target=${'#reviewViewModal-' + r.id}"
                                title="Посмотреть">
                            <i class="bi bi-eye"></i>
                        </button>

                        <form method="post"
                              th:if="${!r.approved}"
                              th:action="@{'/admin/reviews/' + ${r.id} + '/moderate'}"
                              class="m-0">
                            <input type="hidden" name="approved" value="true">
                            <input type="hidden" name="status" th:value="${status}">
                            <input type="hidden" name="rating" th:value="${rating}">
                            <input type="hidden" name="dateFrom" th:value="${dateFrom}">
                            <input type="hidden" name="dateTo" th:value="${dateTo}">
                            <input type="hidden" name="limit" th:value="${reviewLimit}">
                            <button class="btn btn-outline-success btn-sm admin-mini-icon-btn" type="submit" title="Опубликовать">
                                <i class="bi bi-check-lg"></i>
                            </button>
                        </form>

                        <form method="post"
                              th:if="${r.approved}"
                              th:action="@{'/admin/reviews/' + ${r.id} + '/moderate'}"
                              class="m-0">
                            <input type="hidden" name="approved" value="false">
                            <input type="hidden" name="status" th:value="${status}">
                            <input type="hidden" name="rating" th:value="${rating}">
                            <input type="hidden" name="dateFrom" th:value="${dateFrom}">
                            <input type="hidden" name="dateTo" th:value="${dateTo}">
                            <input type="hidden" name="limit" th:value="${reviewLimit}">
                            <button class="btn btn-outline-secondary btn-sm admin-mini-icon-btn" type="submit" title="Отменить публикацию">
                                <i class="bi bi-x-lg"></i>
                            </button>
                        </form>

                        <form method="post"
                              th:if="${!r.approved}"
                              th:action="@{'/admin/reviews/' + ${r.id} + '/moderate'}"
                              class="m-0">
                            <input type="hidden" name="approved" value="false">
                            <input type="hidden" name="status" th:value="${status}">
                            <input type="hidden" name="rating" th:value="${rating}">
                            <input type="hidden" name="dateFrom" th:value="${dateFrom}">
                            <input type="hidden" name="dateTo" th:value="${dateTo}">
                            <input type="hidden" name="limit" th:value="${reviewLimit}">
                            <button class="btn btn-outline-secondary btn-sm admin-mini-icon-btn" type="submit" title="Не публиковать">
                                <i class="bi bi-dash-lg"></i>
                            </button>
                        </form>

                        <form method="post" th:action="@{'/admin/reviews/' + ${r.id} + '/delete'}" class="m-0">
                            <input type="hidden" name="status" th:value="${status}">
                            <input type="hidden" name="rating" th:value="${rating}">
                            <input type="hidden" name="dateFrom" th:value="${dateFrom}">
                            <input type="hidden" name="dateTo" th:value="${dateTo}">
                            <input type="hidden" name="limit" th:value="${reviewLimit}">
                            <button class="btn btn-outline-danger btn-sm admin-mini-icon-btn" type="submit" title="Удалить">
                                <i class="bi bi-trash3"></i>
                            </button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <form method="get"
          th:if="${hasMoreReviews}"
          th:action="@{/admin/reviews}"
          class="d-grid mt-3">
        <input type="hidden" name="status" th:value="${status}">
        <input type="hidden" name="rating" th:value="${rating}">
        <input type="hidden" name="dateFrom" th:value="${dateFrom}">
        <input type="hidden" name="dateTo" th:value="${dateTo}">
        <input type="hidden" name="limit" th:value="${nextReviewLimit}">
        <button class="btn btn-outline-dark" type="submit">Показать ещё отзывы</button>
    </form>

    <th:block th:if="${!#lists.isEmpty(reviews)}">
        <div class="modal fade"
             th:each="r : ${reviews}"
             th:attr="id=${'reviewViewModal-' + r.id}"
             tabindex="-1"
             aria-hidden="true">
            <div class="modal-dialog modal-lg modal-dialog-scrollable modal-dialog-centered">
                <div class="modal-content review-modal-content">
                    <div class="modal-header">
                        <div class="h6 mb-0">Отзыв #<span th:text="${r.id}"></span></div>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row g-2 small mb-3">
                            <div class="col-md-6">
                                <div class="text-muted">Товар</div>
                                <div>
                                    <a th:if="${r.product != null}" th:href="@{'/admin/products/' + ${r.product.id} + '/edit'}" th:text="${r.product.name}"></a>
                                    <span th:if="${r.product == null}">—</span>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="text-muted">Автор</div>
                                <div th:text="${r.user != null ? r.user.username : (r.guestName != null ? r.guestName : 'Гость')}"></div>
                            </div>
                            <div class="col-md-3">
                                <div class="text-muted">Оценка</div>
                                <div th:text="${r.rating != null ? r.rating + '/5' : '—'}"></div>
                            </div>
                            <div class="col-md-3">
                                <div class="text-muted">Статус</div>
                                <div>
                                    <span th:if="${!r.moderated}">На модерации</span>
                                    <span th:if="${r.moderated and r.approved}">Опубликован</span>
                                    <span th:if="${r.moderated and !r.approved}">Отклонён</span>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="text-muted">Дата</div>
                                <div th:text="${#temporals.format(r.createdAt, 'dd.MM.yyyy HH:mm')}"></div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <div class="text-muted small mb-1">Полный текст отзыва</div>
                            <div th:text="${r.text}"></div>
                        </div>

                        <div class="mb-3" th:if="${reviewImagesByReviewId != null and reviewImagesByReviewId[r.id] != null and !#lists.isEmpty(reviewImagesByReviewId[r.id])}">
                            <div class="text-muted small mb-2">Фотографии</div>
                            <div class="d-flex flex-wrap gap-2">
                                <button class="review-image-thumb-btn"
                                        type="button"
                                        th:each="img : ${reviewImagesByReviewId[r.id]}"
                                        th:attr="data-review-image=${img.imageUrl}">
                                    <img th:src="${img.imageUrl}" alt="">
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-outline-secondary btn-sm" type="button" data-bs-dismiss="modal">Закрыть</button>
                    </div>
                </div>
            </div>
        </div>
    </th:block>

    <div class="review-image-lightbox d-none" id="reviewImageLightbox">
        <button class="review-image-lightbox-close" type="button" id="reviewImageLightboxClose" aria-label="Закрыть">
            <i class="bi bi-x-lg"></i>
        </button>
        <img id="reviewImageLightboxImg" alt="">
    </div>
</main>
<div th:replace="~{fragments :: scripts}"></div>
<script>
    (function () {
        const lightbox = document.getElementById("reviewImageLightbox");
        const lightboxImg = document.getElementById("reviewImageLightboxImg");
        const lightboxClose = document.getElementById("reviewImageLightboxClose");

        if (!lightbox || !lightboxImg || !lightboxClose) {
            return;
        }

        const openLightbox = (src) => {
            lightboxImg.src = src;
            lightbox.classList.remove("d-none");
        };

        const closeLightbox = () => {
            lightbox.classList.add("d-none");
            lightboxImg.src = "";
        };

        document.querySelectorAll("[data-review-image]").forEach((btn) => {
            btn.addEventListener("click", () => {
                const src = btn.getAttribute("data-review-image");
                if (src) {
                    openLightbox(src);
                }
            });
        });

        lightbox.addEventListener("click", (event) => {
            if (event.target === lightbox) {
                closeLightbox();
            }
        });
        lightboxClose.addEventListener("click", closeLightbox);
        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape" && !lightbox.classList.contains("d-none")) {
                closeLightbox();
            }
        });
    })();
</script>
</body>
</html>
