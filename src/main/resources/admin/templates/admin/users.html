<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Админка - Пользователи')}"></head>
<body>
<nav th:replace="~{fragments :: adminNavbar}"></nav>
<main class="container container-wide py-4">
    <nav class="admin-breadcrumb mb-3" aria-label="breadcrumb">
        <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a th:href="@{/admin}">Админка</a></li>
            <li class="breadcrumb-item active" aria-current="page">Пользователи</li>
        </ol>
    </nav>

    <h1 class="h4 mb-3">Пользователи</h1>
    <div class="alert alert-success" th:if="${userSuccess}" th:text="${userSuccess}"></div>
    <div class="alert alert-danger" th:if="${userError}" th:text="${userError}"></div>

    <div class="glass-card p-3 mb-3">
        <form class="row g-2 align-items-end" method="get" th:action="@{/admin/users}">
            <div class="col-md-5">
                <label class="form-label mb-1">Поиск</label>
                <input class="form-control" name="q" placeholder="Имя, логин, email, телефон" th:value="${searchQuery}">
            </div>
            <div class="col-md-3 col-sm-6">
                <label class="form-label mb-1">Статус</label>
                <select class="form-select" name="userEnabled">
                    <option value="ALL" th:selected="${userEnabledFilter == 'ALL'}">Все</option>
                    <option value="ACTIVE" th:selected="${userEnabledFilter == 'ACTIVE'}">Активные</option>
                    <option value="BLOCKED" th:selected="${userEnabledFilter == 'BLOCKED'}">Заблокированные</option>
                </select>
            </div>
            <div class="col-md-3 col-sm-6">
                <label class="form-label mb-1">Сортировка</label>
                <select class="form-select" name="sort">
                    <option value="NEWEST" th:selected="${userSort == 'NEWEST'}">Новые сверху</option>
                    <option value="OLDEST" th:selected="${userSort == 'OLDEST'}">Старые сверху</option>
                    <option value="NAME_ASC" th:selected="${userSort == 'NAME_ASC'}">Имя А-Я</option>
                    <option value="NAME_DESC" th:selected="${userSort == 'NAME_DESC'}">Имя Я-А</option>
                    <option value="ORDERS_DESC" th:selected="${userSort == 'ORDERS_DESC'}">Больше заказов</option>
                    <option value="SPENT_DESC" th:selected="${userSort == 'SPENT_DESC'}">Больше потрачено</option>
                </select>
            </div>
            <div class="col-md-1 d-grid">
                <button class="btn btn-dark" type="submit">OK</button>
            </div>
        </form>
    </div>

    <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-2">
        <div class="small text-muted">
            <span th:text="${totalUsers}">0</span> пользователей,
            показаны <span th:text="${firstItemIndex}">0</span>-<span th:text="${lastItemIndex}">0</span>
        </div>
    </div>

    <div class="glass-card p-4" th:if="${#lists.isEmpty(users)}">
        <div class="text-muted">По выбранным фильтрам пользователи не найдены.</div>
    </div>

    <div class="glass-card p-3 p-md-4 table-responsive" th:if="${!#lists.isEmpty(users)}">
        <table class="table align-middle mb-0">
            <thead>
            <tr>
                <th>ID</th>
                <th>Пользователь</th>
                <th>Контакты</th>
                <th>Заказы</th>
                <th>Потрачено</th>
                <th>Статус</th>
                <th class="text-end">Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${users}">
                <td class="text-muted" th:text="${u.id}">0</td>
                <td>
                    <div class="fw-semibold" th:text="${u.fullName}">Имя</div>
                    <div class="small text-muted" th:text="${'@' + u.username}">@username</div>
                    <div class="small text-muted" th:if="${u.createdAt != null}" th:text="${'Регистрация: ' + #temporals.format(u.createdAt, 'dd.MM.yyyy HH:mm')}"></div>
                </td>
                <td>
                    <div class="small">
                        <a th:href="${'mailto:' + u.email}" th:text="${u.email}">email@example.com</a>
                    </div>
                    <div class="small text-muted mt-1" th:if="${u.phone != null and !#strings.isEmpty(u.phone)}" th:text="${u.phone}"></div>
                </td>
                <td th:text="${userOrderCountById[u.id] != null ? userOrderCountById[u.id] : 0}">0</td>
                <td th:text="${#numbers.formatDecimal(userTotalSpentById[u.id],1,'COMMA',2,'POINT')} + ' ₽'">0 ₽</td>
                <td>
                    <span class="badge text-bg-success" th:if="${T(java.lang.Boolean).TRUE.equals(u.isEnabled)}">Активен</span>
                    <span class="badge text-bg-danger" th:if="${!T(java.lang.Boolean).TRUE.equals(u.isEnabled)}">Заблокирован</span>
                </td>
                <td class="text-end">
                    <div class="d-inline-flex align-items-center gap-2">
                        <a class="btn btn-outline-dark btn-sm" th:href="@{/admin/users/{id}(id=${u.id})}">Подробнее</a>
                        <form method="post" th:action="@{'/admin/users/' + ${u.id} + '/status'}" class="m-0">
                            <input type="hidden" name="enabled" th:value="${!T(java.lang.Boolean).TRUE.equals(u.isEnabled)}">
                            <input type="hidden" name="returnTo" value="list">
                            <input type="hidden" name="q" th:value="${searchQuery}">
                            <input type="hidden" name="userEnabled" th:value="${userEnabledFilter}">
                            <input type="hidden" name="sort" th:value="${userSort}">
                            <input type="hidden" name="page" th:value="${currentPage}">
                            <button class="btn btn-outline-danger btn-sm" type="submit" th:if="${T(java.lang.Boolean).TRUE.equals(u.isEnabled)}">Блок</button>
                            <button class="btn btn-outline-success btn-sm" type="submit" th:if="${!T(java.lang.Boolean).TRUE.equals(u.isEnabled)}">Разблок</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav class="mt-3" th:if="${totalPages > 1}">
        <ul class="pagination mb-0">
            <li class="page-item" th:classappend="${!hasPrevPage} ? ' disabled'">
                <a class="page-link"
                   th:href="${hasPrevPage} ? @{/admin/users(q=${searchQuery},userEnabled=${userEnabledFilter},sort=${userSort},page=${prevPage})} : '#'"
                   tabindex="-1">Назад</a>
            </li>
            <li class="page-item"
                th:each="p : ${#numbers.sequence(1, totalPages)}"
                th:classappend="${p == currentPage} ? ' active'">
                <a class="page-link"
                   th:href="@{/admin/users(q=${searchQuery},userEnabled=${userEnabledFilter},sort=${userSort},page=${p})}"
                   th:text="${p}">1</a>
            </li>
            <li class="page-item" th:classappend="${!hasNextPage} ? ' disabled'">
                <a class="page-link"
                   th:href="${hasNextPage} ? @{/admin/users(q=${searchQuery},userEnabled=${userEnabledFilter},sort=${userSort},page=${nextPage})} : '#'}">Вперёд</a>
            </li>
        </ul>
    </nav>
</main>
<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
