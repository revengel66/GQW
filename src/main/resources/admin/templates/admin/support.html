<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Админка - Заявки')}"></head>
<body>
<nav th:replace="~{fragments :: adminNavbar}"></nav>
<main class="container container-wide py-4">
    <nav class="admin-breadcrumb mb-3" aria-label="breadcrumb">
        <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a th:href="@{/admin}">Админка</a></li>
            <li class="breadcrumb-item active" aria-current="page">Заявки</li>
        </ol>
    </nav>

    <h1 class="h4 mb-3">Заявки</h1>
    <div class="alert alert-success" th:if="${supportSuccess}" th:text="${supportSuccess}"></div>
    <div class="alert alert-danger" th:if="${supportError}" th:text="${supportError}"></div>

    <ul class="nav nav-tabs mb-3">
        <li class="nav-item">
            <a class="nav-link"
               th:classappend="${supportTab == 'CONTACT'} ? ' active'"
               th:href="@{/admin/support(tab='CONTACT',status=${supportStatusFilter},sort=${supportSort},q=${supportQuery},dateFrom=${supportDateFrom},dateTo=${supportDateTo})}">
                Обратная связь
                <span class="badge text-bg-secondary ms-1" th:text="${contactRequestsTotal}">0</span>
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link"
               th:classappend="${supportTab == 'SUPPORT'} ? ' active'"
               th:href="@{/admin/support(tab='SUPPORT',status=${supportStatusFilter},sort=${supportSort},q=${supportQuery},dateFrom=${supportDateFrom},dateTo=${supportDateTo})}">
                Поддержка по заказам
                <span class="badge text-bg-secondary ms-1" th:text="${supportRequestsTotal}">0</span>
            </a>
        </li>
    </ul>

    <section class="glass-card p-3 mb-3">
        <form method="get" class="row g-2 align-items-end">
            <input type="hidden" name="tab" th:value="${supportTab}">
            <div class="col-md-4">
                <label class="form-label mb-1">Поиск</label>
                <input class="form-control" name="q" placeholder="ID, тема, автор, сообщение" th:value="${supportQuery}">
            </div>
            <div class="col-md-2 col-sm-6">
                <label class="form-label mb-1">Статус</label>
                <select class="form-select" name="status">
                    <option value="ALL" th:selected="${supportStatusFilter == 'ALL'}">Все</option>
                    <option value="NEW" th:selected="${supportStatusFilter == 'NEW'}">Новая</option>
                    <option value="IN_PROGRESS" th:selected="${supportStatusFilter == 'IN_PROGRESS'}">В обработке</option>
                    <option value="PROCESSED" th:selected="${supportStatusFilter == 'PROCESSED'}">Обработана</option>
                </select>
            </div>
            <div class="col-md-2 col-sm-6">
                <label class="form-label mb-1">Дата с</label>
                <input class="form-control" type="date" name="dateFrom" th:value="${supportDateFrom}">
            </div>
            <div class="col-md-2 col-sm-6">
                <label class="form-label mb-1">Дата по</label>
                <input class="form-control" type="date" name="dateTo" th:value="${supportDateTo}">
            </div>
            <div class="col-md-2 col-sm-6">
                <label class="form-label mb-1">Сортировка</label>
                <select class="form-select" name="sort">
                    <option value="NEWEST" th:selected="${supportSort == 'NEWEST'}">Сначала новые</option>
                    <option value="OLDEST" th:selected="${supportSort == 'OLDEST'}">Сначала старые</option>
                    <option value="STATUS_ASC" th:selected="${supportSort == 'STATUS_ASC'}">Статус А-Я</option>
                    <option value="STATUS_DESC" th:selected="${supportSort == 'STATUS_DESC'}">Статус Я-А</option>
                </select>
            </div>
            <div class="col-12 d-flex justify-content-end gap-2">
                <a class="btn btn-outline-secondary btn-sm admin-products-reset-btn"
                   th:href="@{/admin/support(tab=${supportTab})}"
                   title="Сбросить">
                    <i class="bi bi-x-lg"></i>
                </a>
                <button class="btn btn-dark admin-products-apply-btn" type="submit" title="Применить">
                    <i class="bi bi-check-lg"></i>
                </button>
            </div>
        </form>
    </section>

    <section class="glass-card p-4" th:if="${#lists.isEmpty(requests)}">
        <div class="text-muted">Заявки не найдены.</div>
    </section>

    <section class="glass-card p-3 p-md-4 table-responsive" th:if="${!#lists.isEmpty(requests)}">
        <table class="table align-middle mb-0" th:if="${supportTab == 'CONTACT'}">
            <thead>
            <tr>
                <th>ID</th>
                <th>Тема</th>
                <th>Имя</th>
                <th>Email</th>
                <th>Телефон</th>
                <th style="max-width: 360px;">Сообщение</th>
                <th>Дата</th>
                <th>Статус</th>
                <th class="text-end">Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${requests}">
                <td th:text="${r.id}"></td>
                <td th:text="${r.subject != null ? r.subject : 'Заявка'}"></td>
                <td th:text="${r.name}"></td>
                <td><a th:href="${'mailto:' + r.email}" th:text="${r.email}"></a></td>
                <td th:text="${r.phone != null ? r.phone : '—'}"></td>
                <td style="max-width: 360px;">
                    <span class="small text-muted"
                          th:text="${r.message != null and #strings.length(r.message) > 180 ? #strings.substring(r.message, 0, 180) + '…' : r.message}"></span>
                </td>
                <td th:text="${r.createdAt != null ? #temporals.format(r.createdAt, 'dd.MM.yyyy HH:mm') : '—'}"></td>
                <td>
                    <div th:with="st=${supportStatusByRequestId[r.id]}">
                        <span th:class="'badge ' + ${supportStatusClassMap[st] != null ? supportStatusClassMap[st] : 'text-bg-secondary'}"
                              th:text="${supportStatusRuMap[st] != null ? supportStatusRuMap[st] : st}"></span>
                    </div>
                    <form class="mt-2" method="post" th:action="@{'/admin/support/' + ${r.id} + '/status'}">
                        <input type="hidden" name="returnTo" value="list">
                        <input type="hidden" name="tab" th:value="${supportTab}">
                        <input type="hidden" name="listStatus" th:value="${supportStatusFilter}">
                        <input type="hidden" name="sort" th:value="${supportSort}">
                        <input type="hidden" name="q" th:value="${supportQuery}">
                        <input type="hidden" name="dateFrom" th:value="${supportDateFrom}">
                        <input type="hidden" name="dateTo" th:value="${supportDateTo}">
                        <select class="form-select form-select-sm"
                                name="status"
                                onchange="if(this.form.requestSubmit){this.form.requestSubmit();}else{this.form.submit();}">
                            <option value="NEW" th:selected="${supportStatusByRequestId[r.id] == 'NEW'}">Новая</option>
                            <option value="IN_PROGRESS" th:selected="${supportStatusByRequestId[r.id] == 'IN_PROGRESS'}">В обработке</option>
                            <option value="PROCESSED" th:selected="${supportStatusByRequestId[r.id] == 'PROCESSED'}">Обработана</option>
                        </select>
                    </form>
                </td>
                <td class="text-end">
                    <a class="btn btn-outline-dark btn-sm admin-mini-icon-btn"
                       th:href="@{/admin/support/{id}(id=${r.id},tab=${supportTab},status=${supportStatusFilter},sort=${supportSort},q=${supportQuery},dateFrom=${supportDateFrom},dateTo=${supportDateTo})}"
                       title="Открыть">
                        <i class="bi bi-eye"></i>
                    </a>
                </td>
            </tr>
            </tbody>
        </table>

        <table class="table align-middle mb-0" th:if="${supportTab == 'SUPPORT'}">
            <thead>
            <tr>
                <th>ID</th>
                <th>Тема</th>
                <th>Пользователь</th>
                <th>Заказ</th>
                <th style="max-width: 360px;">Сообщение</th>
                <th>Дата</th>
                <th>Статус</th>
                <th class="text-end">Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${requests}">
                <td th:text="${r.id}"></td>
                <td th:text="${r.subject != null ? r.subject : 'Заявка'}"></td>
                <td>
                    <a th:if="${r.user != null}" th:href="@{'/admin/users/' + ${r.user.id}}">
                        <span th:text="${r.user.fullName != null and !#strings.isEmpty(r.user.fullName) ? r.user.fullName : r.user.username}"></span>
                    </a>
                    <span th:if="${r.user == null}" th:text="${r.name != null ? r.name : '—'}"></span>
                </td>
                <td>
                    <a th:if="${r.order != null}"
                       th:href="@{/admin/orders/{id}(id=${r.order.id})}"
                       th:text="${'#' + r.order.id}"></a>
                    <span th:if="${r.order == null}">—</span>
                </td>
                <td style="max-width: 360px;">
                    <span class="small text-muted"
                          th:text="${r.message != null and #strings.length(r.message) > 180 ? #strings.substring(r.message, 0, 180) + '…' : r.message}"></span>
                </td>
                <td th:text="${r.createdAt != null ? #temporals.format(r.createdAt, 'dd.MM.yyyy HH:mm') : '—'}"></td>
                <td>
                    <div th:with="st=${supportStatusByRequestId[r.id]}">
                        <span th:class="'badge ' + ${supportStatusClassMap[st] != null ? supportStatusClassMap[st] : 'text-bg-secondary'}"
                              th:text="${supportStatusRuMap[st] != null ? supportStatusRuMap[st] : st}"></span>
                    </div>
                    <form class="mt-2" method="post" th:action="@{'/admin/support/' + ${r.id} + '/status'}">
                        <input type="hidden" name="returnTo" value="list">
                        <input type="hidden" name="tab" th:value="${supportTab}">
                        <input type="hidden" name="listStatus" th:value="${supportStatusFilter}">
                        <input type="hidden" name="sort" th:value="${supportSort}">
                        <input type="hidden" name="q" th:value="${supportQuery}">
                        <input type="hidden" name="dateFrom" th:value="${supportDateFrom}">
                        <input type="hidden" name="dateTo" th:value="${supportDateTo}">
                        <select class="form-select form-select-sm"
                                name="status"
                                onchange="if(this.form.requestSubmit){this.form.requestSubmit();}else{this.form.submit();}">
                            <option value="NEW" th:selected="${supportStatusByRequestId[r.id] == 'NEW'}">Новая</option>
                            <option value="IN_PROGRESS" th:selected="${supportStatusByRequestId[r.id] == 'IN_PROGRESS'}">В обработке</option>
                            <option value="PROCESSED" th:selected="${supportStatusByRequestId[r.id] == 'PROCESSED'}">Обработана</option>
                        </select>
                    </form>
                </td>
                <td class="text-end">
                    <a class="btn btn-outline-dark btn-sm admin-mini-icon-btn"
                       th:href="@{/admin/support/{id}(id=${r.id},tab=${supportTab},status=${supportStatusFilter},sort=${supportSort},q=${supportQuery},dateFrom=${supportDateFrom},dateTo=${supportDateTo})}"
                       title="Открыть">
                        <i class="bi bi-eye"></i>
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
