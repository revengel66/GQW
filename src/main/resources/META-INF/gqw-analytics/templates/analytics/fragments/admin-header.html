<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="adminHeader(activeTab, showSettingsButton, authenticated)"
     class="navbar navbar-expand-lg bg-white navbar-shadow sticky-top">
    <div class="container container-wide py-1">
        <a class="navbar-brand fw-semibold" th:href="@{/analytics-admin/dashboard}">Analytics Admin</a>
        <div class="navbar-nav ms-3">
            <a class="nav-link"
               th:href="@{/analytics-admin/dashboard}"
               data-analytics-top-tab="overview"
               th:classappend="${activeTab == 'overview'} ? ' active' : ''">Дашборд</a>
            <a class="nav-link"
               th:href="@{/analytics-admin/dashboard(tab='universal')}"
               data-analytics-top-tab="universal"
               th:classappend="${activeTab == 'universal'} ? ' active' : ''">Диагностика</a>
            <a class="nav-link"
               th:href="@{/analytics-admin/dashboard(tab='raw')}"
               data-analytics-top-tab="raw"
               th:classappend="${activeTab == 'raw'} ? ' active' : ''">Журнал событий</a>
            <a class="nav-link"
               th:href="@{/analytics-admin/dashboard(tab='system')}"
               data-analytics-top-tab="system"
               th:classappend="${activeTab == 'system'} ? ' active' : ''">Служебные события</a>
            <a class="nav-link"
               th:href="@{/analytics-admin/dashboard(tab='compare')}"
               data-analytics-top-tab="compare"
               th:classappend="${activeTab == 'compare'} ? ' active' : ''">Сравнение</a>
        </div>
        <div class="ms-auto d-flex align-items-center gap-3 analytics-admin-header-actions">
            <a class="analytics-admin-header-link"
               th:classappend="${activeTab == 'dictionaries'} ? ' active' : ''"
               th:href="@{/analytics-admin/dictionaries}">
                Справочники
            </a>
            <a class="analytics-admin-header-link"
               th:classappend="${activeTab == 'instruction'} ? ' active' : ''"
               th:href="@{/analytics-admin/instruction}"
               target="_blank"
               rel="noopener noreferrer">
                Инструкция
            </a>

            <th:block th:if="${authenticated}">
                <div class="d-flex align-items-center gap-2 analytics-admin-header-tools">
                    <button class="btn btn-outline-dark btn-sm analytics-header-icon-btn analytics-help-mode-toggle"
                            type="button"
                            id="analytics-help-mode-toggle"
                            aria-pressed="false"
                            aria-label="Включить подсказки"
                            title="Включить подсказки">
                        <i class="bi bi-question-circle" aria-hidden="true"></i>
                    </button>
                    <button th:if="${showSettingsButton}"
                            class="btn btn-dark btn-sm analytics-header-icon-btn analytics-runtime-settings-trigger"
                            type="button"
                            id="analytics-runtime-settings-open"
                            title="Настройки аналитики"
                            aria-label="Настройки аналитики">
                        <i class="bi bi-gear-fill" aria-hidden="true"></i>
                    </button>
                    <form method="post" th:action="@{/analytics-admin/logout}" class="m-0">
                        <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="btn btn-dark btn-sm analytics-header-icon-btn out-btn"
                                type="submit"
                                title="Logout"
                                aria-label="Logout">
                            <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
                        </button>
                    </form>
                </div>
            </th:block>

            <th:block th:unless="${authenticated}">
                <a class="btn btn-outline-dark btn-sm" th:href="@{/analytics-admin/login}">Вход</a>
            </th:block>
        </div>
    </div>
    <script>
    (function () {
        var key = "analyticsHelpMode";

        function readEnabled() {
            try {
                return window.localStorage.getItem(key) === "on";
            } catch (error) {
                return false;
            }
        }

        function writeEnabled(enabled) {
            try {
                window.localStorage.setItem(key, enabled ? "on" : "off");
            } catch (error) {
                // localStorage can be unavailable in restricted modes; default remains off.
            }
        }

        function apply(enabled) {
            document.documentElement.classList.toggle("analytics-help-enabled", enabled);
            document.documentElement.classList.toggle("analytics-help-disabled", !enabled);
            var button = document.getElementById("analytics-help-mode-toggle");
            if (!button) {
                return;
            }
            button.setAttribute("aria-pressed", enabled ? "true" : "false");
            var title = enabled ? "Выключить подсказки" : "Включить подсказки";
            button.title = title;
            button.setAttribute("aria-label", title);
            button.classList.toggle("is-enabled", enabled);
            button.classList.toggle("btn-dark", enabled);
            button.classList.toggle("btn-outline-dark", !enabled);
        }

        function bindToggle() {
            apply(readEnabled());
            var button = document.getElementById("analytics-help-mode-toggle");
            if (!button || button.dataset.helpToggleBound === "true") {
                return;
            }
            button.dataset.helpToggleBound = "true";
            button.addEventListener("click", function () {
                var enabled = !document.documentElement.classList.contains("analytics-help-enabled");
                writeEnabled(enabled);
                apply(enabled);
            });
        }

        bindToggle();
        document.addEventListener("DOMContentLoaded", bindToggle);
    })();
    </script>
</nav>
</body>
</html>
