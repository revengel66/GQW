<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}">
    <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}">
    <title>Analytics Module · Конфигурация аналитики</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/analytics/css/app.css(v='20260609-01')}">
</head>
<body>
<th:block
    th:replace="~{analytics/fragments/admin-header :: adminHeader(activeTab=${analyticsActiveTab}, showSettingsButton=${true}, authenticated=${true})}"></th:block>

<main class="container container-wide py-4 analytics-page analytics-settings-page" id="analytics-runtime-settings-page">
    <div class="analytics-settings-page-head">
        <div>
            <h1 class="analytics-page-title mb-2">Конфигурация аналитики</h1>
            <p class="analytics-settings-page-subtitle mb-0">
                Управление хранением данных, подготовкой агрегатов, логами, обслуживанием и рабочими параметрами Analytics Module.
            </p>
        </div>
        <div class="analytics-settings-page-actions">
            <a class="btn btn-outline-dark" th:href="@{/analytics-admin/dashboard}">
                <i class="bi bi-arrow-left" aria-hidden="true"></i>
                Назад
            </a>
        </div>
    </div>

    <div class="analytics-settings-layout">
        <aside class="analytics-settings-aside" aria-label="Разделы конфигурации">
            <nav class="analytics-settings-nav" id="analytics-runtime-settings-nav">
                <a class="analytics-settings-nav-link is-active" href="#runtime-section-diagnostics">Диагностика состояния</a>
            </nav>
            <div class="analytics-settings-sticky-actions">
                <button class="btn btn-dark w-100" type="button" id="analytics-runtime-settings-save">
                    Сохранить
                </button>
            </div>
        </aside>

        <div class="analytics-settings-content">
            <section class="glass-card analytics-runtime-group analytics-settings-section" id="runtime-section-diagnostics">
                <div class="analytics-runtime-diagnostics">
                    <div class="analytics-runtime-diagnostics-head">
                        <div>
                            <div class="analytics-runtime-group-title mb-0">Диагностика состояния</div>
                            <div class="analytics-runtime-group-sub mb-0">
                                Свежесть агрегатов, размеры таблиц и примерное время до полного обновления.
                            </div>
                        </div>
                    </div>
                    <div class="analytics-runtime-diagnostics-actions mt-3 mb-2">
                        <button class="btn btn-dark btn-sm" type="button" id="analytics-runtime-diagnostics-refresh">Обновить</button>
                        <span class="analytics-runtime-action">
                            <button class="btn btn-dark btn-sm" type="button" id="analytics-runtime-op-refresh">Обновить агрегаты</button>
                            <button class="analytics-runtime-help-badge" type="button" data-runtime-action-help="refresh" aria-label="Пояснение: обновить агрегаты">?</button>
                        </span>
                        <span class="analytics-runtime-action">
                            <button class="btn btn-dark btn-sm" type="button" id="analytics-runtime-op-backfill">Догнать историю</button>
                            <button class="analytics-runtime-help-badge" type="button" data-runtime-action-help="backfill" aria-label="Пояснение: догнать историю">?</button>
                        </span>
                        <span class="analytics-runtime-action">
                            <button class="btn btn-dark btn-sm" type="button" id="analytics-runtime-op-lifecycle">Очистить и обслужить</button>
                            <button class="analytics-runtime-help-badge" type="button" data-runtime-action-help="lifecycle" aria-label="Пояснение: очистить и обслужить">?</button>
                        </span>
                        <span class="analytics-runtime-action">
                            <button class="btn btn-dark btn-sm" type="button" id="analytics-runtime-op-log-index">Индексировать логи сейчас</button>
                            <button class="analytics-runtime-help-badge" type="button" data-runtime-action-help="logs" aria-label="Пояснение: индексировать логи">?</button>
                        </span>
                        <span class="analytics-runtime-action">
                            <button class="btn btn-dark btn-sm" type="button" id="analytics-runtime-op-log-cleanup">Очистить старые логи</button>
                            <button class="analytics-runtime-help-badge" type="button" data-runtime-action-help="log-cleanup" aria-label="Пояснение: очистить старые логи">?</button>
                        </span>
                    </div>
                    <div id="analytics-runtime-diagnostics-status" class="small text-muted mt-2 mb-3"></div>
                    <div id="analytics-runtime-operation-status" class="small text-muted mb-2"></div>
                    <div id="analytics-runtime-diagnostics-content"></div>
                </div>
            </section>

            <div id="analytics-runtime-settings-status" class="small text-muted mb-3"></div>
            <div id="analytics-runtime-settings-error" class="alert alert-danger d-none" role="alert"></div>
            <div id="analytics-runtime-settings-form"></div>
        </div>
    </div>
</main>

<div class="modal fade" id="analytics-help-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content review-modal-content">
            <div class="modal-header">
                <div class="modal-title h6 mb-0" id="analytics-help-modal-title">Пояснение</div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
            </div>
            <div class="modal-body" id="analytics-help-modal-body"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    window.analyticsApiBase = [[${analyticsApiBase}]];
</script>
<script th:src="@{/analytics/js/analytics-settings.js(v='20260604-08')}"></script>
</body>
</html>
