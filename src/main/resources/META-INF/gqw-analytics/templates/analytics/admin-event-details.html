<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}">
    <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}">
    <title>Детали события · Analytics Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/analytics/css/app.css(v='20260614-event-details')}">
</head>
<body class="analytics-admin-scale">
<nav class="store-navbar navbar navbar-expand-lg bg-white border-bottom">
    <div class="container container-wide">
        <a class="navbar-brand fw-semibold" th:href="@{/analytics-admin/dashboard}">Analytics Module</a>
        <div class="navbar-nav flex-row gap-3">
            <a class="nav-link" th:href="@{/analytics-admin/dashboard(tab='overview')}">Дашборд</a>
            <a class="nav-link" th:href="@{/analytics-admin/dashboard(tab='universal')}">Диагностика</a>
            <a class="nav-link active" th:href="@{/analytics-admin/dashboard(tab='raw')}">Журнал событий</a>
            <a class="nav-link" th:href="@{/analytics-admin/dashboard(tab='metrics')}">Служебные события</a>
            <a class="nav-link" th:href="@{/analytics-admin/dashboard(tab='compare')}">Сравнение</a>
        </div>
        <div class="analytics-admin-header-actions ms-auto">
            <a class="btn btn-dark btn-sm analytics-admin-header-link" th:href="@{/analytics-admin/dashboard(tab='raw')}">
                <i class="bi bi-arrow-left"></i>
                К журналу
            </a>
        </div>
    </div>
</nav>

<main class="container container-wide py-4 analytics-page">
    <section class="analytics-event-details-page"
             id="analytics-event-details-page"
             th:attr="data-event-uid=${analyticsEventUid},data-event-id=${analyticsEventId}">
        <div class="d-flex align-items-start justify-content-between gap-3 mb-3">
            <div>
                <h1 class="analytics-page-title mb-1" id="analytics-event-details-title">Детали события</h1>
            </div>
        </div>
        <section class="analytics-event-details-body-shell" id="analytics-event-details-body"></section>
    </section>
</main>

<script th:inline="javascript">
    window.analyticsApiBase = /*[[${analyticsApiBase}]]*/ "/analytics-admin/api";
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/analytics/js/analytics-dashboard.js(v='20260614-event-details')}"></script>
</body>
</html>
