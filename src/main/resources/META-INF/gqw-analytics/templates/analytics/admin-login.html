<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}">
    <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}">
    <title>Analytics Admin · Вход</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/analytics/css/app.css(v='20260514-4')}">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 480px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h1 class="h4 mb-3">Вход в Analytics Admin</h1>
            <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>
            <div th:if="${success}" class="alert alert-success py-2" th:text="${success}"></div>
            <form method="post" th:action="@{/analytics-admin/login}">
                <div class="mb-3">
                    <label class="form-label">Логин</label>
                    <input class="form-control" name="username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Пароль</label>
                    <input class="form-control" type="password" name="password" required>
                </div>
                <button class="btn btn-dark w-100" type="submit">Войти</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
