spring.application.name=gqw

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gqw}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
app.datasource.auto-create-db=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false
spring.mvc.hiddenmethod.filter.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never

app.upload.products-dir=${APP_UPLOAD_PRODUCTS_DIR:uploads/products}
app.upload.categories-dir=${APP_UPLOAD_CATEGORIES_DIR:uploads/categories}
app.upload.library-dir=${APP_UPLOAD_LIBRARY_DIR:uploads/library}
app.upload.reviews-dir=${APP_UPLOAD_REVIEWS_DIR:uploads/reviews}

logging.level.org.hibernate.SQL=INFO
logging.level.com.example.gqw.shop=INFO
logging.level.com.example.gqw.admin=INFO
logging.file.name=${LOG_FILE:logs/gqw.log}
logging.charset.console=UTF-8
logging.charset.file=UTF-8
