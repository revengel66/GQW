spring.application.name=gqw

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gqw}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
app.datasource.auto-create-db=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false
spring.mvc.hiddenmethod.filter.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never

app.upload.products-dir=${APP_UPLOAD_PRODUCTS_DIR:uploads/products}
app.upload.categories-dir=${APP_UPLOAD_CATEGORIES_DIR:uploads/categories}
app.upload.library-dir=${APP_UPLOAD_LIBRARY_DIR:uploads/library}
app.upload.reviews-dir=${APP_UPLOAD_REVIEWS_DIR:uploads/reviews}

logging.level.org.hibernate.SQL=INFO
logging.level.com.example.gqw.shop=TRACE
logging.level.com.example.gqw.admin=TRACE
logging.level.com.example.gqw.analytics=OFF
logging.level.com.example.gqw.analytics.service.AnalyticsLogArchiveIndexService=INFO
logging.pattern.level=%5p [trace:%X{traceId}] [event:%X{analyticsEventUid}] [module:%X{appModule}]
logging.file.name=${LOG_FILE:logs/gqw.log}
logging.charset.console=UTF-8
logging.charset.file=UTF-8

app.analytics.method-logging.enabled=${APP_ANALYTICS_METHOD_LOGGING_ENABLED:true}
app.analytics.method-logging.base-package=${APP_ANALYTICS_METHOD_LOGGING_BASE_PACKAGE:com.example.gqw}
app.analytics.bootstrap-enabled=${APP_ANALYTICS_BOOTSTRAP_ENABLED:false}
app.analytics.seed-missing-events-enabled=${APP_ANALYTICS_SEED_MISSING_EVENTS_ENABLED:true}
app.analytics.event-codes-migration-enabled=${APP_ANALYTICS_EVENT_CODES_MIGRATION_ENABLED:true}
app.analytics.auto-crud.enabled=${APP_ANALYTICS_AUTO_CRUD_ENABLED:false}
app.analytics.logging.default-module-code=${APP_ANALYTICS_LOG_MODULE_DEFAULT:DEFAULT}
app.analytics.filter-rollup.enabled=${APP_ANALYTICS_FILTER_ROLLUP_ENABLED:true}
app.analytics.filter-rollup.long-range-days=${APP_ANALYTICS_FILTER_ROLLUP_LONG_RANGE_DAYS:30}
app.analytics.filter-rollup.refresh-recent-days=${APP_ANALYTICS_FILTER_ROLLUP_REFRESH_RECENT_DAYS:7}
app.analytics.filter-rollup.refresh-cron=${APP_ANALYTICS_FILTER_ROLLUP_REFRESH_CRON:0 */10 * * * *}
app.analytics.time-rollup.enabled=${APP_ANALYTICS_TIME_ROLLUP_ENABLED:true}
app.analytics.time-rollup.refresh-cron=${APP_ANALYTICS_TIME_ROLLUP_REFRESH_CRON:0 */5 * * * *}
app.analytics.time-rollup.overlap-minutes=${APP_ANALYTICS_TIME_ROLLUP_OVERLAP_MINUTES:10}
app.analytics.time-rollup.bootstrap-lookback-days=${APP_ANALYTICS_TIME_ROLLUP_BOOTSTRAP_LOOKBACK_DAYS:370}
app.analytics.stage-metric-rollup.enabled=${APP_ANALYTICS_STAGE_METRIC_ROLLUP_ENABLED:true}
app.analytics.stage-metric-rollup.refresh-cron=${APP_ANALYTICS_STAGE_METRIC_ROLLUP_REFRESH_CRON:0 */5 * * * *}
app.analytics.stage-metric-rollup.overlap-minutes=${APP_ANALYTICS_STAGE_METRIC_ROLLUP_OVERLAP_MINUTES:10}
app.analytics.stage-metric-rollup.bootstrap-lookback-days=${APP_ANALYTICS_STAGE_METRIC_ROLLUP_BOOTSTRAP_LOOKBACK_DAYS:370}
