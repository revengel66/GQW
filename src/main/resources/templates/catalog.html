<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Каталог')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<main class="container container-wide py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">Каталог товаров</h1>
        <form method="get" class="d-flex gap-2">
            <input type="hidden" name="page" value="0">
            <select class="form-select" name="sort" onchange="this.form.submit()">
                <option value="date_desc" th:selected="${sort == 'date_desc'}">Сначала новые</option>
                <option value="name_asc" th:selected="${sort == 'name_asc'}">По алфавиту A-Z</option>
                <option value="name_desc" th:selected="${sort == 'name_desc'}">По алфавиту Z-A</option>
                <option value="price_asc" th:selected="${sort == 'price_asc'}">Цена по возрастанию</option>
                <option value="price_desc" th:selected="${sort == 'price_desc'}">Цена по убыванию</option>
            </select>
        </form>
    </div>
    <div class="row g-3">
        <div class="col-12 col-md-6 col-xl-3" th:each="p : ${pageData.content}">
            <div class="glass-card p-3 h-100 card-product">
                <h3 class="h6 mb-2" th:text="${p.name}"></h3>
                <p class="small text-muted mb-2" th:text="${p.shortDescription}"></p>
                <p class="fw-semibold mb-3" th:text="${#numbers.formatDecimal(p.price, 1, 'COMMA', 2, 'POINT')} + ' ₽'"></p>
                <a class="btn btn-primary btn-sm w-100" th:href="@{'/product/' + ${p.slug}}">Открыть</a>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
