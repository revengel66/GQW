<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Админка - Файловый менеджер')}"></head>
<body>
<nav th:replace="~{fragments :: adminNavbar}"></nav>
<main class="container container-wide py-4">
    <nav class="admin-breadcrumb mb-3" aria-label="breadcrumb">
        <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a th:href="@{/admin}">Админка</a></li>
            <li class="breadcrumb-item active" aria-current="page">Файловый менеджер</li>
        </ol>
    </nav>

    <h1 class="h4 mb-3">Файловый менеджер</h1>
    <div class="alert alert-success" th:if="${filesSuccess}" th:text="${filesSuccess}"></div>
    <div class="alert alert-danger" th:if="${filesError}" th:text="${filesError}"></div>

    <div class="glass-card p-4 mb-4">
        <h2 class="h6 mb-3">Загрузка изображений</h2>
        <form method="post" enctype="multipart/form-data" th:action="@{/admin/files/upload}" class="row g-2">
            <div class="col-12">
                <input class="form-control" type="file" name="files" accept=".jpg,.jpeg,.png,.webp" multiple>
            </div>
            <div class="col-12">
                <button class="btn btn-primary" type="submit">Загрузить</button>
            </div>
        </form>
    </div>

    <div class="glass-card p-4">
        <h2 class="h6 mb-3">Библиотека файлов</h2>
        <div class="text-muted" th:if="${#lists.isEmpty(libraryFiles)}">Файлов пока нет.</div>
        <div class="row g-3" th:if="${!#lists.isEmpty(libraryFiles)}">
            <div class="col-6 col-md-3 col-xl-2" th:each="f : ${libraryFiles}">
                <a class="text-decoration-none d-block" th:href="${f.url}" target="_blank">
                    <img class="w-100 rounded-3 border mb-2" th:src="${f.url}" alt="" style="aspect-ratio: 1 / 1; object-fit: cover;">
                    <div class="small text-truncate" th:text="${f.name}"></div>
                </a>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
