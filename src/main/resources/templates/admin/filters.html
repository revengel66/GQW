<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Админка - Фильтры')}"></head>
<body>
<nav th:replace="~{fragments :: adminNavbar}"></nav>
<main class="container container-wide py-4">
    <nav class="admin-breadcrumb mb-3" aria-label="breadcrumb">
        <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a th:href="@{/admin}">Админка</a></li>
            <li class="breadcrumb-item active" aria-current="page">Фильтры</li>
        </ol>
    </nav>

    <h1 class="h4 mb-3">Фильтры и опции</h1>
    <div class="alert alert-success" th:if="${filterSuccess}" th:text="${filterSuccess}"></div>
    <div class="alert alert-danger" th:if="${filterError}" th:text="${filterError}"></div>

    <div class="glass-card p-4 mb-4">
        <h2 class="h6 mb-3">Создать фильтр</h2>
        <form class="row g-3" method="post" th:action="@{/admin/filters/save}">
            <div class="col-md-3">
                <label class="form-label">Код</label>
                <input class="form-control" id="new-filter-code" name="code" placeholder="processor" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">Название</label>
                <input class="form-control" id="new-filter-name" name="name" placeholder="Процессор" required>
            </div>
            <div class="col-md-2">
                <label class="form-label">Тип значения</label>
                <select class="form-select" name="valueType">
                    <option value="LIST">LIST</option>
                    <option value="NUMBER">NUMBER</option>
                    <option value="TEXT">TEXT</option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label">Вид вывода</label>
                <select class="form-select" name="viewType">
                    <option value="CHECKBOX">CHECKBOX</option>
                    <option value="RADIO">RADIO</option>
                    <option value="SLIDER">SLIDER</option>
                </select>
            </div>
            <div class="col-md-1 d-flex align-items-end">
                <div class="form-check mb-2">
                    <input class="form-check-input" type="checkbox" name="multiValue" value="true" id="multiValueCreate">
                    <label class="form-check-label small" for="multiValueCreate">multi</label>
                </div>
            </div>
            <div class="col-12">
                <label class="form-label">Привязка к категориям</label>
                <div class="glass-card p-3" style="max-height: 200px; overflow:auto;">
                    <div class="form-check mb-1" th:each="row : ${categoryRows}">
                        <input class="form-check-input" type="checkbox" name="categoryIds"
                               th:id="${'new-filter-cat-' + row.category.id}" th:value="${row.category.id}">
                        <label class="form-check-label"
                               th:for="${'new-filter-cat-' + row.category.id}"
                               th:text="${#strings.repeat('— ', row.depth) + row.category.name}"></label>
                    </div>
                </div>
            </div>
            <div class="col-12">
                <label class="form-label">Предустановленные значения (через запятую или с новой строки)</label>
                <textarea class="form-control" name="predefinedValues" rows="2" placeholder="Ryzen 7, Core i5, Core i7"></textarea>
            </div>
            <div class="col-12">
                <button class="btn btn-primary" type="submit">Сохранить фильтр</button>
            </div>
        </form>
    </div>

    <div class="glass-card p-4">
        <h2 class="h6 mb-3">Существующие фильтры</h2>
        <div class="text-muted" th:if="${#lists.isEmpty(filters)}">Фильтры пока не созданы.</div>
        <div class="accordion" id="filtersAccordion" th:if="${!#lists.isEmpty(filters)}">
            <div class="accordion-item mb-2" th:each="f,iter : ${filters}">
                <h2 class="accordion-header" th:attr="id=${'filterHead-' + iter.index}">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                            th:attr="data-bs-target=${'#filterBody-' + iter.index},aria-controls=${'filterBody-' + iter.index}">
                        <span th:text="${f.name + ' (' + f.code + ')'}"></span>
                    </button>
                </h2>
                <div class="accordion-collapse collapse"
                     th:attr="id=${'filterBody-' + iter.index},aria-labelledby=${'filterHead-' + iter.index}"
                     data-bs-parent="#filtersAccordion">
                    <div class="accordion-body">
                        <form class="row g-2 mb-3" method="post" th:action="@{/admin/filters/save}">
                            <input type="hidden" name="filterId" th:value="${f.id}">
                            <div class="col-md-3"><input class="form-control" name="code" th:value="${f.code}" required></div>
                            <div class="col-md-4"><input class="form-control" name="name" th:value="${f.name}" required></div>
                            <div class="col-md-2">
                                <select class="form-select" name="valueType">
                                    <option value="LIST" th:selected="${f.valueType == 'LIST'}">LIST</option>
                                    <option value="NUMBER" th:selected="${f.valueType == 'NUMBER'}">NUMBER</option>
                                    <option value="TEXT" th:selected="${f.valueType == 'TEXT'}">TEXT</option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <select class="form-select" name="viewType">
                                    <option value="CHECKBOX" th:selected="${f.viewType == 'CHECKBOX'}">CHECKBOX</option>
                                    <option value="RADIO" th:selected="${f.viewType == 'RADIO'}">RADIO</option>
                                    <option value="SLIDER" th:selected="${f.viewType == 'SLIDER'}">SLIDER</option>
                                </select>
                            </div>
                            <div class="col-md-1 d-flex align-items-center">
                                <input class="form-check-input" type="checkbox" name="multiValue" value="true"
                                       th:checked="${f.multiValue}">
                            </div>
                            <div class="col-12">
                                <div class="glass-card p-2" style="max-height: 160px; overflow:auto;">
                                    <div class="form-check mb-1" th:each="row : ${categoryRows}">
                                        <input class="form-check-input" type="checkbox" name="categoryIds"
                                               th:id="${'filter-' + f.id + '-cat-' + row.category.id}"
                                               th:value="${row.category.id}"
                                               th:checked="${filterCategoryIdsMap[f.id] != null and filterCategoryIdsMap[f.id].contains(row.category.id)}">
                                        <label class="form-check-label"
                                               th:for="${'filter-' + f.id + '-cat-' + row.category.id}"
                                               th:text="${#strings.repeat('— ', row.depth) + row.category.name}"></label>
                                    </div>
                                </div>
                            </div>
                            <div class="col-12">
                                <textarea class="form-control" name="predefinedValues" rows="2" placeholder="Добавить значения (через запятую/новую строку)"></textarea>
                            </div>
                            <div class="col-12 d-flex gap-2">
                                <button class="btn btn-primary btn-sm" type="submit">Сохранить</button>
                                <button class="btn btn-outline-danger btn-sm"
                                        type="submit"
                                        formnovalidate
                                        th:formaction="@{'/admin/filters/' + ${f.id} + '/delete'}">Удалить</button>
                            </div>
                        </form>

                        <div>
                            <div class="small text-muted mb-1">Значения фильтра</div>
                            <span class="badge text-bg-light border me-1 mb-1"
                                  th:each="opt : ${filterOptionsMap[f.id]}"
                                  th:text="${opt.value}"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragments :: scripts}"></div>
<script>
    (function () {
        const codeInput = document.getElementById("new-filter-code");
        const nameInput = document.getElementById("new-filter-name");
        if (!codeInput || !nameInput) {
            return;
        }
        const translitMap = {
            "а": "a", "б": "b", "в": "v", "г": "g", "д": "d", "е": "e", "ё": "e", "ж": "zh", "з": "z", "и": "i",
            "й": "y", "к": "k", "л": "l", "м": "m", "н": "n", "о": "o", "п": "p", "р": "r", "с": "s", "т": "t",
            "у": "u", "ф": "f", "х": "h", "ц": "c", "ч": "ch", "ш": "sh", "щ": "sch", "ъ": "", "ы": "y", "ь": "",
            "э": "e", "ю": "yu", "я": "ya"
        };
        const normalize = (value) => {
            const lower = String(value || "").trim().toLowerCase();
            let out = "";
            for (const ch of lower) {
                out += Object.prototype.hasOwnProperty.call(translitMap, ch) ? translitMap[ch] : ch;
            }
            return out
                .replace(/[^a-z0-9]+/g, "-")
                .replace(/^-+|-+$/g, "")
                .replace(/-{2,}/g, "-");
        };
        let codeTouched = codeInput.value.trim().length > 0;
        codeInput.addEventListener("input", () => {
            codeTouched = codeInput.value.trim().length > 0;
        });
        nameInput.addEventListener("input", () => {
            if (!codeTouched) {
                codeInput.value = normalize(nameInput.value);
            }
        });
    })();
</script>
</body>
</html>
