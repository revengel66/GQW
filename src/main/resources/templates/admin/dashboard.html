<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Админка')}"></head>
<body>
<nav th:replace="~{fragments :: adminNavbar}"></nav>
<main class="container container-wide py-4">
    <h1 class="h4 mb-3">Панель администратора</h1>
    <div class="admin-grid mb-4">
        <div class="glass-card p-3"><div class="text-muted small">Товары</div><div class="fs-4 fw-bold" th:text="${productsCount}"></div></div>
        <div class="glass-card p-3"><div class="text-muted small">Заказы</div><div class="fs-4 fw-bold" th:text="${ordersCount}"></div></div>
        <div class="glass-card p-3"><div class="text-muted small">Пользователи</div><div class="fs-4 fw-bold" th:text="${usersCount}"></div></div>
        <div class="glass-card p-3"><div class="text-muted small">Новые заявки</div><div class="fs-4 fw-bold" th:text="${openRequestsCount}"></div></div>
        <div class="glass-card p-3"><div class="text-muted small">Отзывы на модерации</div><div class="fs-4 fw-bold" th:text="${pendingReviewsCount}"></div></div>
    </div>

    <div class="glass-card p-4" style="max-width:520px;">
        <h2 class="h6 mb-3">Изменить admin-учётные данные</h2>
        <form class="row g-2" method="post" th:action="@{/admin/credentials}">
            <div class="col-12"><input class="form-control" name="username" value="admin"></div>
            <div class="col-12"><input class="form-control" name="password" type="password" placeholder="Новый пароль"></div>
            <div class="col-12"><button class="btn btn-primary" type="submit">Сохранить</button></div>
        </form>
    </div>
</main>
<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
