<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${categoryFormMode == 'edit' ? 'Админка - Редактирование категории' : 'Админка - Новая категория'})}"></head>
<body>
<nav th:replace="~{fragments :: adminNavbar}"></nav>
<main class="container container-wide py-4">
    <nav class="admin-breadcrumb mb-3" aria-label="breadcrumb">
        <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a th:href="@{/admin}">Админка</a></li>
            <li class="breadcrumb-item"><a th:href="@{/admin/categories}">Категории</a></li>
            <li class="breadcrumb-item active"
                aria-current="page"
                th:text="${categoryFormMode == 'edit' ? 'Редактирование' : 'Создание'}">Создание</li>
        </ol>
    </nav>

    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <div class="h4 mb-0" th:text="${categoryFormMode == 'edit' ? 'Редактирование категории' : 'Создание категории'}">Создание категории</div>
        <a class="btn btn-outline-secondary btn-sm" th:href="@{/admin/categories}">Назад к списку</a>
    </div>

    <div class="alert alert-success" th:if="${categorySuccess}" th:text="${categorySuccess}"></div>
    <div class="alert alert-danger" th:if="${categoryError}" th:text="${categoryError}"></div>

    <form method="post"
          enctype="multipart/form-data"
          th:action="${categoryFormMode == 'edit'} ? @{'/admin/categories/' + ${editingCategory.id}} : @{/admin/categories}">
        <div class="row g-4">
            <aside class="col-12 col-xl-4">
                <div class="glass-card p-3 h-100">
                    <div class="catalog-panel-title mb-3">Родительская категория</div>
                    <div class="catalog-sections">
                        <div class="catalog-section-item">
                            <label class="form-check mb-0">
                                <input class="form-check-input" type="radio" name="parentId" value="0"
                                       th:checked="${editingCategory == null or editingCategory.parent == null}">
                                <span class="form-check-label catalog-section-link">Без родителя</span>
                            </label>
                        </div>
                        <div class="catalog-section-item" th:each="row : ${categoryRows}">
                            <label class="form-check mb-0"
                                   th:if="${editingCategory == null or row.category.id != editingCategory.id}"
                                   th:style="'padding-left:' + (${row.depth} * 14) + 'px'">
                                <input class="form-check-input" type="radio" name="parentId" th:value="${row.category.id}"
                                       th:checked="${editingCategory != null and editingCategory.parent != null and editingCategory.parent.id == row.category.id}">
                                <span class="form-check-label catalog-section-link" th:text="${row.category.name}">Категория</span>
                            </label>
                        </div>
                    </div>
                </div>
            </aside>

            <section class="col-12 col-xl-8">
                <div class="glass-card p-4">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Название</label>
                            <input class="form-control"
                                   id="category-name-input"
                                   name="name"
                                   th:value="${editingCategory != null ? editingCategory.name : ''}"
                                   required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Slug</label>
                            <input class="form-control"
                                   id="category-slug-input"
                                   name="slug"
                                   th:value="${editingCategory != null ? editingCategory.slug : ''}"
                                   required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Описание</label>
                            <textarea class="form-control"
                                      name="description"
                                      rows="4"
                                      th:text="${editingCategory != null ? editingCategory.description : ''}"></textarea>
                        </div>
                        <div class="col-12">
                            <label class="form-check mb-0">
                                <input class="form-check-input" type="checkbox" name="isPublished" value="true"
                                       th:checked="${editingCategory == null or editingCategory.isPublished}">
                                <span class="form-check-label">Опубликована</span>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="glass-card p-4 mt-3">
                    <div class="d-flex align-items-center justify-content-between gap-2 flex-wrap mb-3">
                        <div class="small text-muted">Изображение категории</div>
                        <div class="d-flex gap-2 flex-wrap">
                            <button class="btn btn-outline-secondary btn-sm" type="button" id="clear-category-image-btn">Очистить</button>
                            <button class="btn btn-dark btn-sm" type="button" data-bs-toggle="modal" data-bs-target="#categoryLibraryModal">Файловый менеджер</button>
                        </div>
                    </div>
                    <input class="form-control mb-2" type="file" name="image" id="category-image-input" accept=".jpg,.jpeg,.png,.webp">
                    <input type="hidden" name="libraryImageUrl" id="category-library-image-url"
                           th:value="${editingCategory != null ? editingCategory.imageUrl : ''}">
                    <div class="admin-photo-preview-box mt-3" id="category-image-preview-box"
                         th:with="previewImage=${editingCategory != null ? editingCategory.imageUrl : null}">
                        <img id="category-image-preview" th:if="${previewImage != null}" th:src="${previewImage}" alt="">
                        <i id="category-image-camera" th:if="${previewImage == null}" class="bi bi-camera"></i>
                    </div>
                </div>

                <div class="mt-3">
                    <button class="btn btn-primary" type="submit"
                            th:text="${categoryFormMode == 'edit' ? 'Сохранить изменения' : 'Создать категорию'}">Сохранить</button>
                </div>
            </section>
        </div>
    </form>

    <div class="glass-card p-4 mt-4" th:if="${categoryFormMode == 'edit'}">
        <div class="fw-semibold mb-2">Товары в категории</div>
        <div class="text-muted" th:if="${categoryProducts == null or #lists.isEmpty(categoryProducts)}">
            В этой категории пока нет товаров.
        </div>
        <ul class="list-group list-group-flush" th:if="${categoryProducts != null and !#lists.isEmpty(categoryProducts)}">
            <li class="list-group-item px-0 d-flex justify-content-between align-items-center"
                th:each="p : ${categoryProducts}">
                <div>
                    <div class="fw-semibold" th:text="${p.name}"></div>
                    <div class="small text-muted" th:text="${p.slug}"></div>
                </div>
                <a class="btn btn-outline-secondary btn-sm"
                   th:href="@{'/admin/products/' + ${p.id} + '/edit'}">
                    Редактировать товар
                </a>
            </li>
        </ul>
    </div>
</main>

<div class="modal fade" id="categoryLibraryModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable modal-dialog-centered">
        <div class="modal-content review-modal-content">
            <div class="modal-header">
                <div class="h6 mb-0">Файловый менеджер</div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="row g-2 align-items-end mb-3">
                    <div class="col-12 col-lg-8">
                        <label class="form-label">Загрузить файлы в библиотеку</label>
                        <input class="form-control" type="file" id="category-library-upload-input" accept=".jpg,.jpeg,.png,.webp" multiple>
                    </div>
                    <div class="col-12 col-lg-4 d-grid">
                        <button class="btn btn-dark" type="button" id="category-library-upload-btn">Загрузить в библиотеку</button>
                    </div>
                </div>
                <div class="alert alert-danger d-none" id="category-library-error"></div>
                <div class="row g-2" id="category-library-grid">
                    <div class="col-6 col-md-4 col-lg-3" th:each="f : ${libraryFiles}">
                        <button type="button"
                                class="btn btn-outline-secondary w-100 h-100 p-2 text-start js-category-library-select"
                                th:attr="data-url=${f.url}">
                            <img class="w-100 rounded-2 mb-2" th:src="${f.url}" alt="" style="aspect-ratio:1/1;object-fit:cover;">
                            <span class="small d-block text-truncate" th:text="${f.name}">file.webp</span>
                        </button>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline-secondary btn-sm" type="button" data-bs-dismiss="modal">Закрыть</button>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments :: scripts}"></div>
<script>
    (function () {
        const nameInput = document.getElementById("category-name-input");
        const slugInput = document.getElementById("category-slug-input");
        const csrfToken = document.querySelector("meta[name='_csrf']")?.getAttribute("content");
        const csrfHeader = document.querySelector("meta[name='_csrf_header']")?.getAttribute("content");
        const imageInput = document.getElementById("category-image-input");
        const clearBtn = document.getElementById("clear-category-image-btn");
        const libraryInput = document.getElementById("category-library-image-url");
        const previewBox = document.getElementById("category-image-preview-box");
        const previewImg = document.getElementById("category-image-preview");
        const cameraIcon = document.getElementById("category-image-camera");

        const setPreview = (url) => {
            if (!previewBox) {
                return;
            }
            let img = previewBox.querySelector("img");
            let icon = previewBox.querySelector("i");
            if (url) {
                if (!img) {
                    img = document.createElement("img");
                    previewBox.appendChild(img);
                }
                img.src = url;
                if (icon) {
                    icon.remove();
                }
            } else {
                if (img) {
                    img.remove();
                }
                if (!icon) {
                    icon = document.createElement("i");
                    icon.className = "bi bi-camera";
                    previewBox.appendChild(icon);
                }
            }
        };

        if (nameInput && slugInput) {
            const translitMap = {
                "а": "a", "б": "b", "в": "v", "г": "g", "д": "d", "е": "e", "ё": "e", "ж": "zh", "з": "z", "и": "i",
                "й": "y", "к": "k", "л": "l", "м": "m", "н": "n", "о": "o", "п": "p", "р": "r", "с": "s", "т": "t",
                "у": "u", "ф": "f", "х": "h", "ц": "c", "ч": "ch", "ш": "sh", "щ": "sch", "ъ": "", "ы": "y", "ь": "",
                "э": "e", "ю": "yu", "я": "ya"
            };
            const normalize = (value) => {
                const lower = String(value || "").trim().toLowerCase();
                let out = "";
                for (const ch of lower) {
                    out += Object.prototype.hasOwnProperty.call(translitMap, ch) ? translitMap[ch] : ch;
                }
                return out
                    .replace(/[^a-z0-9]+/g, "-")
                    .replace(/^-+|-+$/g, "")
                    .replace(/-{2,}/g, "-");
            };
            let slugTouched = slugInput.value.trim().length > 0;
            slugInput.addEventListener("input", () => {
                slugTouched = slugInput.value.trim().length > 0;
            });
            nameInput.addEventListener("input", () => {
                if (!slugTouched) {
                    slugInput.value = normalize(nameInput.value);
                }
            });
            if (!slugInput.value.trim()) {
                slugInput.value = normalize(nameInput.value);
            }
        }

        if (imageInput) {
            imageInput.addEventListener("change", () => {
                const file = imageInput.files && imageInput.files[0];
                if (!file) {
                    return;
                }
                const reader = new FileReader();
                reader.onload = (event) => {
                    if (event && event.target && typeof event.target.result === "string") {
                        setPreview(event.target.result);
                        if (libraryInput) {
                            libraryInput.value = "";
                        }
                    }
                };
                reader.readAsDataURL(file);
            });
        }

        if (clearBtn) {
            clearBtn.addEventListener("click", () => {
                if (imageInput) {
                    imageInput.value = "";
                }
                if (libraryInput) {
                    libraryInput.value = "";
                }
                setPreview("");
            });
        }

        const categoryLibraryGrid = document.getElementById("category-library-grid");
        const categoryLibraryUploadInput = document.getElementById("category-library-upload-input");
        const categoryLibraryUploadBtn = document.getElementById("category-library-upload-btn");
        const categoryLibraryError = document.getElementById("category-library-error");

        const showLibraryError = (message) => {
            if (!categoryLibraryError) {
                return;
            }
            if (!message) {
                categoryLibraryError.classList.add("d-none");
                categoryLibraryError.textContent = "";
                return;
            }
            categoryLibraryError.classList.remove("d-none");
            categoryLibraryError.textContent = message;
        };

        const renderCategoryLibraryGrid = (files) => {
            if (!categoryLibraryGrid) {
                return;
            }
            categoryLibraryGrid.innerHTML = "";
            files.forEach((f) => {
                if (!f || !f.url) {
                    return;
                }
                const col = document.createElement("div");
                col.className = "col-6 col-md-4 col-lg-3";
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "btn btn-outline-secondary w-100 h-100 p-2 text-start js-category-library-select";
                btn.setAttribute("data-url", f.url);
                const img = document.createElement("img");
                img.className = "w-100 rounded-2 mb-2";
                img.style.aspectRatio = "1/1";
                img.style.objectFit = "cover";
                img.src = f.url;
                img.alt = "";
                const name = document.createElement("span");
                name.className = "small d-block text-truncate";
                name.textContent = f.name || f.url;
                btn.appendChild(img);
                btn.appendChild(name);
                col.appendChild(btn);
                categoryLibraryGrid.appendChild(col);
            });
        };

        if (categoryLibraryGrid) {
            categoryLibraryGrid.addEventListener("click", (event) => {
                const target = event.target instanceof HTMLElement ? event.target.closest(".js-category-library-select") : null;
                if (!(target instanceof HTMLElement)) {
                    return;
                }
                const url = target.getAttribute("data-url");
                if (!url) {
                    return;
                }
                if (libraryInput) {
                    libraryInput.value = url;
                }
                if (imageInput) {
                    imageInput.value = "";
                }
                setPreview(url);
            });
        }

        if (categoryLibraryUploadBtn && categoryLibraryUploadInput) {
            categoryLibraryUploadBtn.addEventListener("click", async () => {
                showLibraryError("");
                const files = Array.from(categoryLibraryUploadInput.files || []);
                if (!files.length) {
                    showLibraryError("Выберите файлы для загрузки.");
                    return;
                }
                const formData = new FormData();
                files.forEach((file) => formData.append("files", file));
                try {
                    const response = await fetch("/admin/files/upload-json", {
                        method: "POST",
                        headers: csrfToken && csrfHeader ? {[csrfHeader]: csrfToken} : {},
                        body: formData
                    });
                    const payload = await response.json();
                    if (!response.ok || payload.ok === false) {
                        showLibraryError(payload.message || "Не удалось загрузить файлы.");
                        return;
                    }
                    categoryLibraryUploadInput.value = "";
                    renderCategoryLibraryGrid(Array.isArray(payload.files) ? payload.files : []);
                } catch (error) {
                    showLibraryError("Ошибка сети при загрузке файлов.");
                }
            });
        }

        if (!previewImg && !cameraIcon) {
            setPreview("");
        }
    })();
</script>
</body>
</html>
