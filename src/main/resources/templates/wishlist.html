<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Избранное')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<main class="container container-wide py-4">
    <h1 class="h4 mb-3">Избранное</h1>
    <div class="glass-card p-4">
        <div th:if="${#lists.isEmpty(items)}" class="text-muted">Список избранного пуст.</div>
        <div class="row g-3" th:if="${!#lists.isEmpty(items)}">
            <div class="col-12 col-md-6 col-xl-4" th:each="it : ${items}">
                <div class="glass-card p-3 h-100">
                    <h3 class="h6 mb-2" th:text="${it.product.name}"></h3>
                    <p class="small text-muted mb-3" th:text="${it.product.shortDescription}"></p>
                    <div class="d-flex gap-2">
                        <a class="btn btn-primary btn-sm" th:href="@{'/product/' + ${it.product.slug}}">Открыть</a>
                        <form th:action="@{/wishlist/remove}" method="post">
                            <input type="hidden" name="itemId" th:value="${it.id}">
                            <button class="btn btn-outline-danger btn-sm" type="submit">Удалить</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
