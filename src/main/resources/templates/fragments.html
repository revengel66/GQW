<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">GQW</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-white navbar-shadow sticky-top" th:fragment="navbar">
    <div class="container container-wide py-1">
        <a class="navbar-brand fw-semibold" th:href="@{/}">GQW Tech</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/catalog}">Каталог</a></li>
                <li class="nav-item" th:if="${currentUser != null and currentUser.isAdmin}">
                    <a class="nav-link" th:href="@{/admin}">Админка</a>
                </li>
            </ul>
            <div class="d-flex gap-2 align-items-center">
                <span class="text-muted small d-none d-lg-inline">+7 (999) 111-22-33</span>
                <a class="btn btn-outline-secondary btn-sm" th:href="@{/wishlist}"><i class="bi bi-heart"></i></a>
                <a class="btn btn-outline-secondary btn-sm" th:href="@{/cart}"><i class="bi bi-cart3"></i></a>
                <a class="btn btn-outline-primary btn-sm" th:if="${currentUser == null}" th:href="@{/login}">Войти</a>
                <a class="btn btn-primary btn-sm" th:if="${currentUser != null}" th:href="@{/account}">Кабинет</a>
            </div>
        </div>
    </div>
</nav>

<nav class="navbar navbar-expand-lg bg-white navbar-shadow sticky-top" th:fragment="adminNavbar">
    <div class="container container-wide py-1">
        <a class="navbar-brand fw-semibold" th:href="@{/admin}">Админка GQW</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/admin/products}">Товары</a>
            <a class="nav-link" th:href="@{/admin/categories}">Категории</a>
            <a class="nav-link" th:href="@{/admin/orders}">Заказы</a>
            <a class="nav-link" th:href="@{/admin/users}">Пользователи</a>
            <a class="nav-link" th:href="@{/admin/reviews}">Отзывы</a>
            <a class="nav-link" th:href="@{/admin/support}">Заявки</a>
            <a class="nav-link" th:href="@{/}">На сайт</a>
        </div>
    </div>
</nav>

<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>
</body>
</html>
