<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Оформление заказа')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<main class="container container-wide py-4">
    <h1 class="h4 mb-3">Оформление заказа</h1>
    <div class="row g-4">
        <div class="col-lg-7">
            <div class="glass-card p-4">
                <form th:action="@{/checkout}" th:object="${checkoutRequest}" method="post" class="row g-3">
                    <div class="col-12">
                        <label class="form-label">ФИО</label>
                        <input class="form-control" th:field="*{customerName}">
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('customerName')}" th:errors="*{customerName}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input class="form-control" th:field="*{customerEmail}">
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('customerEmail')}" th:errors="*{customerEmail}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Телефон</label>
                        <input class="form-control" th:field="*{customerPhone}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Способ получения</label>
                        <select class="form-select" th:field="*{deliveryType}" id="delivery-type-select">
                            <option value="PICKUP">Самовывоз</option>
                            <option value="DELIVERY">Доставка по городу</option>
                        </select>
                    </div>
                    <div class="col-md-6" id="pickup-date-wrap">
                        <label class="form-label">Дата самовывоза</label>
                        <input class="form-control" type="date" th:field="*{pickupDate}">
                    </div>
                    <div class="col-md-6 d-none" id="delivery-date-wrap">
                        <label class="form-label">Дата доставки</label>
                        <input class="form-control" type="date" th:field="*{deliveryDate}">
                    </div>
                    <div class="col-md-6 d-none" id="delivery-time-wrap">
                        <label class="form-label">К какому времени доставить</label>
                        <input class="form-control"
                               type="time"
                               th:field="*{deliveryTime}"
                               min="10:00"
                               max="21:00"
                               step="300">
                        <div class="small text-muted mt-1">Рабочие часы доставки: 10:00-21:00</div>
                    </div>
                    <div class="col-12 d-none" id="delivery-address-wrap">
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label">Адрес доставки</label>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Улица</label>
                                <input class="form-control" th:field="*{deliveryStreet}" placeholder="Улица">
                            </div>
                            <div class="col-md-2 col-6">
                                <label class="form-label">Дом</label>
                                <input class="form-control" th:field="*{deliveryHouse}" placeholder="Дом">
                            </div>
                            <div class="col-md-2 col-6">
                                <label class="form-label">Квартира</label>
                                <input class="form-control" th:field="*{deliveryApartment}" placeholder="Кв.">
                            </div>
                            <div class="col-md-2 col-6">
                                <label class="form-label">Подъезд</label>
                                <input class="form-control" th:field="*{deliveryEntrance}" placeholder="Подъезд">
                            </div>
                            <div class="col-md-2 col-6">
                                <label class="form-label">Этаж</label>
                                <input class="form-control" th:field="*{deliveryFloor}" placeholder="Этаж">
                            </div>
                            <div class="col-md-2 col-6">
                                <label class="form-label">Домофон</label>
                                <input class="form-control" th:field="*{deliveryIntercom}" placeholder="Домофон">
                            </div>
                        </div>
                    </div>
                    <div class="col-12">
                        <button class="btn btn-primary" type="submit">Подтвердить заказ</button>
                    </div>
                </form>
            </div>
        </div>
        <div class="col-lg-5">
            <div class="glass-card p-4">
                <h2 class="h6 mb-3">Состав заказа</h2>
                <div class="d-flex justify-content-between mb-2" th:each="it : ${items}">
                    <span th:text="${it.product.name + ' x' + it.quantity}"></span>
                    <span th:text="${#numbers.formatDecimal(it.product.price * it.quantity,1,'COMMA',2,'POINT')} + ' ₽'"></span>
                </div>
                <hr>
                <div class="d-flex justify-content-between fw-bold">
                    <span>Итого</span>
                    <span th:text="${#numbers.formatDecimal(total,1,'COMMA',2,'POINT')} + ' ₽'"></span>
                </div>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragments :: scripts}"></div>
<script>
    (function () {
        const typeSelect = document.getElementById("delivery-type-select");
        const pickupDateWrap = document.getElementById("pickup-date-wrap");
        const deliveryDateWrap = document.getElementById("delivery-date-wrap");
        const deliveryTimeWrap = document.getElementById("delivery-time-wrap");
        const deliveryAddressWrap = document.getElementById("delivery-address-wrap");
        const pickupDateInput = document.querySelector("input[name='pickupDate']");
        const deliveryDateInput = document.querySelector("input[name='deliveryDate']");
        const deliveryTimeInput = document.querySelector("input[name='deliveryTime']");
        const deliveryStreetInput = document.querySelector("input[name='deliveryStreet']");
        if (!typeSelect || !pickupDateWrap || !deliveryDateWrap || !deliveryTimeWrap || !deliveryAddressWrap) {
            return;
        }
        const sync = () => {
            const delivery = typeSelect.value === "DELIVERY";
            pickupDateWrap.classList.toggle("d-none", delivery);
            deliveryDateWrap.classList.toggle("d-none", !delivery);
            deliveryTimeWrap.classList.toggle("d-none", !delivery);
            deliveryAddressWrap.classList.toggle("d-none", !delivery);
            if (pickupDateInput) {
                pickupDateInput.required = !delivery;
            }
            if (deliveryDateInput) {
                deliveryDateInput.required = delivery;
            }
            if (deliveryTimeInput) {
                deliveryTimeInput.required = delivery;
            }
            if (deliveryStreetInput) {
                deliveryStreetInput.required = delivery;
            }
        };
        typeSelect.addEventListener("change", sync);
        sync();
    })();
</script>
</body>
</html>
