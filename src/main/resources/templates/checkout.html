<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Оформление заказа')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<main class="container container-wide py-4">
    <h1 class="h4 mb-3">Оформление заказа</h1>
    <div class="row g-4">
        <div class="col-lg-7">
            <div class="glass-card p-4">
                <form th:action="@{/checkout}" th:object="${checkoutRequest}" method="post" class="row g-3">
                    <div class="col-12">
                        <label class="form-label">ФИО</label>
                        <input class="form-control" th:field="*{customerName}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input class="form-control" th:field="*{customerEmail}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Телефон</label>
                        <input class="form-control" th:field="*{customerPhone}">
                    </div>
                    <div class="col-12">
                        <div class="alert alert-light border">Способ получения: <strong>самовывоз (Главный филиал)</strong></div>
                    </div>
                    <div class="col-12">
                        <button class="btn btn-primary" type="submit">Подтвердить заказ</button>
                    </div>
                </form>
            </div>
        </div>
        <div class="col-lg-5">
            <div class="glass-card p-4">
                <h2 class="h6 mb-3">Состав заказа</h2>
                <div class="d-flex justify-content-between mb-2" th:each="it : ${items}">
                    <span th:text="${it.product.name + ' x' + it.quantity}"></span>
                    <span th:text="${#numbers.formatDecimal(it.product.price * it.quantity,1,'COMMA',2,'POINT')} + ' ₽'"></span>
                </div>
                <hr>
                <div class="d-flex justify-content-between fw-bold">
                    <span>Итого</span>
                    <span th:text="${#numbers.formatDecimal(total,1,'COMMA',2,'POINT')} + ' ₽'"></span>
                </div>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
