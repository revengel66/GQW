<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Отзывы')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<main class="container container-wide py-4 pb-5">
    <section class="glass-card p-4 p-lg-5">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h3 mb-0">Отзывы покупателей</h1>
            <span class="text-muted small" th:text="${'Всего: ' + #lists.size(reviewsFeed)}"></span>
        </div>
        <p class="text-muted mb-4">Публикуются только отзывы, прошедшие модерацию.</p>
        <div class="row g-3" th:if="${reviewsFeed != null and !#lists.isEmpty(reviewsFeed)}">
            <div class="col-12 col-lg-6" th:each="r : ${reviewsFeed}">
                <article class="glass-card p-3 h-100">
                    <div class="d-flex justify-content-between mb-2">
                        <strong th:text="${r.user != null ? r.user.username : 'Покупатель'}"></strong>
                        <span class="small text-muted" th:text="${r.product != null ? r.product.name : 'Товар'}"></span>
                    </div>
                    <div class="expandable-text js-expandable-text mb-2" data-collapsed-lines="4">
                        <div class="expandable-text-content js-expandable-content" th:text="${r.text}"></div>
                        <button class="expandable-text-toggle js-expandable-toggle d-none"
                                type="button"
                                data-label-more="Показать ещё"
                                data-label-less="Скрыть">
                            Показать ещё
                        </button>
                    </div>
                    <div class="small text-muted">
                        <span th:if="${r.rating != null}" th:text="${'Оценка: ' + r.rating + '/5'}"></span>
                        <span th:if="${r.rating == null}">Без оценки</span>
                    </div>
                </article>
            </div>
        </div>
        <div class="text-muted" th:if="${reviewsFeed == null or #lists.isEmpty(reviewsFeed)}">
            Пока нет опубликованных отзывов.
        </div>
    </section>
</main>
<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
