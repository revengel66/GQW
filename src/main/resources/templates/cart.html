<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Корзина')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<main class="container container-wide py-4">
    <h1 class="h4 mb-3">Корзина</h1>
    <div class="glass-card p-4">
        <div th:if="${#lists.isEmpty(items)}" class="text-muted">Корзина пока пуста.</div>
        <div th:if="${!#lists.isEmpty(items)}">
            <table class="table align-middle">
                <thead>
                <tr>
                    <th>Товар</th>
                    <th>Цена</th>
                    <th>Кол-во</th>
                    <th>Сумма</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="it : ${items}">
                    <td th:text="${it.product.name}"></td>
                    <td th:text="${#numbers.formatDecimal(it.product.price,1,'COMMA',2,'POINT')} + ' ₽'"></td>
                    <td>
                        <form class="d-flex gap-2" th:action="@{/cart/update}" method="post">
                            <input type="hidden" name="itemId" th:value="${it.id}">
                            <input class="form-control form-control-sm" type="number" min="1" name="quantity" th:value="${it.quantity}" style="max-width:90px;">
                            <button class="btn btn-outline-secondary btn-sm" type="submit">OK</button>
                        </form>
                    </td>
                    <td th:text="${#numbers.formatDecimal(it.product.price * it.quantity,1,'COMMA',2,'POINT')} + ' ₽'"></td>
                    <td>
                        <form th:action="@{/cart/remove}" method="post">
                            <input type="hidden" name="itemId" th:value="${it.id}">
                            <button class="btn btn-outline-danger btn-sm" type="submit">Удалить</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
            <div class="d-flex justify-content-between align-items-center mt-3">
                <div class="h5 mb-0">Итого: <span th:text="${#numbers.formatDecimal(total,1,'COMMA',2,'POINT')} + ' ₽'"></span></div>
                <a class="btn btn-primary" th:href="@{/checkout}">Оформить заказ</a>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
