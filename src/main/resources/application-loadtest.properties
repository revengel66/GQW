# Load-test profile for measuring Analytics instrumentation overhead with
# snapshot/async writes and Analytics background jobs enabled.
#
# Run with:
#   .\gradlew.bat bootRun --args="--spring.profiles.active=loadtest"

# Keep Analytics instrumentation fully enabled: events, stages, attributes,
# metrics, frontend telemetry and tracing continue to be persisted.
app.analytics.instrumentation.enabled=true

# Move Analytics write operations out of the critical HTTP request path.
# A single writer preserves event -> stage -> metric/finish ordering.
app.analytics.async.enabled=true
app.analytics.async.queue-capacity=50000
app.analytics.async.worker-threads=1
app.analytics.async.offer-timeout-ms=5
app.analytics.async.shutdown-timeout-seconds=30

# Snapshot mode stores all server-side Analytics data in ThreadLocal during
# the request and enqueues one EventSnapshot at finishEvent.
app.analytics.snapshot.enabled=true
app.analytics.snapshot.queue-capacity=50000
app.analytics.snapshot.offer-timeout-ms=5
app.analytics.snapshot.shutdown-timeout-seconds=30

# Enable Analytics scheduled background jobs for stage 2 load testing: rollups,
# aggregation, log indexing, lifecycle cleanup and HTTP fallback retry flushing.
app.analytics.scheduled-jobs.enabled=true

# Enable rollup and lifecycle jobs for this profile.
app.analytics.filter-rollup.enabled=true
app.analytics.time-rollup.enabled=true
app.analytics.stage-metric-rollup.enabled=true
app.analytics.lifecycle.enabled=true

# Enable built-in Analytics log-line messages for load testing. This
# does not change event/stage/metric/attribute persistence.
app.analytics.logging.enabled=true
app.analytics.method-logging.enabled=true

# Keep fixed Analytics stage loggers visible again. Stored stages remain enabled.
logging.level.analytics.db.stage=INFO
logging.level.analytics.layer.stage=INFO
logging.level.com.example.gqw.analytics.logging.AnalyticsMethodLoggingAspect=INFO
