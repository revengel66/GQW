spring.datasource.url=jdbc:h2:mem:gqw;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false;NON_KEYWORDS=VALUE;INIT=CREATE SCHEMA IF NOT EXISTS analytics\\;CREATE SCHEMA IF NOT EXISTS shop
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
app.datasource.auto-create-db=false
app.startup.runners-enabled=false
app.seed.enabled=false
app.analytics.bootstrap-enabled=false
app.analytics.filter-rollup.enabled=false
app.analytics.time-rollup.enabled=false
app.analytics.stage-metric-rollup.enabled=false
app.analytics.seed-missing-events-enabled=false
app.analytics.event-codes-migration-enabled=false
app.analytics.lifecycle.enabled=false
app.analytics.auto-crud.enabled=false

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.thymeleaf.cache=false
